<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Current · Padala Go Rider</title>
<link rel="stylesheet" href="../shared/styles.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  .filter-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; -webkit-overflow-scrolling:touch; }
  .filter-row::-webkit-scrollbar{ display:none; }
  .filter-chip{
    flex:0 0 auto; padding:8px 14px; border-radius:20px; font-size:12.5px; font-weight:600;
    background:var(--paper); color:var(--teal-dark); border:1.5px solid var(--line);
    cursor:pointer; white-space:nowrap; user-select:none;
  }
  .filter-chip.active{ background:var(--teal); color:#fff; border-color:var(--teal); }
  .topbar-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .wallet-pill{
    flex-shrink:0; display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.15);
    color:#fff; font-family:'Space Mono'; font-weight:700; font-size:14px;
    padding:8px 12px; border-radius:14px; text-decoration:none; margin-top:2px;
  }
  .wallet-pill.low{ background:#F0A93A; color:var(--teal-dark); }
  .wallet-pill .warn{ font-size:13px; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="topbar-row">
      <div>
        <div class="eyebrow">Padala Go Rider</div>
        <h1>Current</h1>
        <div class="sub">Your active delivery and order history</div>
      </div>
      <a href="wallet.html" class="wallet-pill" id="walletPill">
        <span id="walletWarn" class="warn" style="display:none;">⚠️</span>
        <span id="walletBalanceHeader">₱0</span>
      </a>
    </div>
  </div>

  <div class="content">
    <div id="activeSection" style="display:none; margin-bottom:24px;">
      <h3 style="font-size:15px; margin-bottom:8px;">Your Active Delivery</h3>
      <div id="activeCard"></div>

      <div style="text-align:center; margin:14px 0;">
        <button type="button" class="btn btn-outline" id="viewMapBtn" style="width:auto; display:none; padding:11px 26px;">🗺️ View Map</button>
      </div>

      <div class="order-card" id="etaBanner" style="display:none; margin-top:10px; background:#EAF3FF; border-color:#C7DEFF;">
        <div style="display:flex; align-items:center; gap:10px;">
          <div style="font-size:22px;">⏱️</div>
          <div>
            <div style="font-weight:700; color:#2A5FAD; font-size:13.5px;" id="etaText">Calculating arrival time…</div>
            <div style="font-size:12px; color:#8A8178;" id="etaSub"></div>
          </div>
        </div>
      </div>
      <div class="order-card" id="arrivedBanner" style="display:none; margin-top:10px; background:#FDF1DC; border-color:#F0D9A8;">
        <div style="display:flex; align-items:center; gap:10px;">
          <div style="font-size:22px;">🛵</div>
          <div>
            <div style="font-weight:700; color:#B67A16; font-size:13.5px;">You've arrived at the pickup point</div>
            <div style="font-size:12px; color:#8A8178;" id="arrivedTime"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="mapModalRoot"></div>

    <h3 style="font-size:15px; margin-bottom:8px;">Past Orders</h3>
    <div class="filter-row" id="pastFilters">
      <div class="filter-chip active" data-category="all">All</div>
      <div class="filter-chip" data-category="bike_delivery">🏍️ Bike Delivery</div>
      <div class="filter-chip" data-category="padala_pabili">🧾 Padala/Pabili</div>
    </div>
    <div id="pastList">
      <div class="empty-state">Loading history…</div>
    </div>
  </div>

  <div class="tabbar">
    <a href="orders.html"><span class="g">🏍️</span>Deliveries</a>
    <a href="current.html" class="active"><span class="g">📋</span>Current</a>
    <a href="menu.html"><span class="g">☰</span>Menu</a>
    <a href="#" id="logoutLink"><span class="g">🚪</span>Log Out</a>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script>
let currentUser = null;

function serviceLabel(s){ return s === 'padala_pabili' ? 'Padala / Pabili' : 'Bike Delivery'; }

/* ---------------------------------------------------------
   Live ticking ETA countdown for the rider's own Current tab —
   same pattern as the customer's order-status.html. Reads the
   `riderLocation` field already written onto the order doc by
   active-delivery.html, so no separate geolocation watch is
   needed here; this just renders the latest known fix.
   --------------------------------------------------------- */
let etaDeadlineMs = null;
let etaTotalMs = null;        // baseline duration of the current phase — used for the % fill on the transit line
let etaPhase = '';            // 'pickup' or 'dropoff' — which leg the countdown is currently for
let etaCountdownTimer = null;
let currentActiveOrder = null; // latest active-order data, so the map button/modal can use it
let mapModalOpen = false;
let fullMapRef = null;
let progressLineRef = null;

function startEtaCountdown(){
  if(etaCountdownTimer) return; // already ticking — recalibration just moved the deadline
  tickEtaCountdown();
  etaCountdownTimer = setInterval(tickEtaCountdown, 1000);
}

function stopEtaCountdown(){
  if(etaCountdownTimer){
    clearInterval(etaCountdownTimer);
    etaCountdownTimer = null;
  }
  etaDeadlineMs = null;
}

function tickEtaCountdown(){
  if(etaDeadlineMs === null) return;
  const secsLeft = Math.max(0, Math.round((etaDeadlineMs - Date.now()) / 1000));

  const etaText = document.getElementById('etaText');
  if(etaText){
    if(secsLeft <= 0){
      etaText.textContent = "Arriving any moment…";
    } else {
      const m = Math.floor(secsLeft / 60);
      const s = secsLeft % 60;
      etaText.textContent = m > 0 ? `Arriving in ${m}m ${s.toString().padStart(2,'0')}s` : `Arriving in ${s}s`;
    }
  }

  if(mapModalOpen) renderTransitProgress(secsLeft);
}

function formatMmSs(secs){
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return m > 0 ? `${m}m ${s.toString().padStart(2,'0')}s` : `${s}s`;
}

/* Draws the "transit line" progress inside the full-screen map modal:
   a track line between pickup and drop-off plus a colored overlay line
   that grows to show how far along the trip the rider is. Since the
   full-screen map intentionally shows only pickup + drop-off (no live
   pin), progress is driven by elapsed time against the current phase's
   estimated duration rather than actual position — same straight-line
   approximation used everywhere else in this app. */
function renderTransitProgress(secsLeft){
  const fillEl = document.getElementById('transitProgressFill');
  const textEl = document.getElementById('fullMapEtaText');
  if(!fillEl || !textEl) return;

  let pct = 0;
  let label = 'Waiting for location…';

  if(etaPhase === 'dropoff' && etaTotalMs){
    const totalSecs = etaTotalMs / 1000;
    pct = Math.min(100, Math.max(0, Math.round((1 - secsLeft / totalSecs) * 100)));
    label = secsLeft <= 0 ? "Arriving at drop-off any moment…" : `Heading to drop-off — ${formatMmSs(secsLeft)} left`;
  } else if(etaPhase === 'pickup'){
    pct = 0; // hasn't started the pickup → drop-off leg shown on this map yet
    label = secsLeft <= 0 ? "Arriving at pickup any moment…" : `Heading to pickup — ${formatMmSs(secsLeft)} left`;
  }

  fillEl.style.width = pct + '%';
  textEl.textContent = label;

  if(progressLineRef && currentActiveOrder && etaPhase === 'dropoff'){
    const o = currentActiveOrder;
    const lat = o.pickup.lat + (o.dropoff.lat - o.pickup.lat) * (pct / 100);
    const lng = o.pickup.lng + (o.dropoff.lng - o.pickup.lng) * (pct / 100);
    progressLineRef.setLatLngs([[o.pickup.lat, o.pickup.lng], [lat, lng]]);
  }
}

function openMapModal(o){
  mapModalOpen = true;
  const root = document.getElementById('mapModalRoot');
  root.innerHTML = `
    <div style="position:fixed; inset:0; background:#fff; z-index:2000; display:flex; flex-direction:column;">
      <div style="display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--line); flex-shrink:0;">
        <div style="font-weight:700; color:var(--teal-dark); font-size:15px;">Route</div>
        <button type="button" id="closeMapBtn" style="border:none; background:none; font-size:22px; color:var(--teal-dark); cursor:pointer; line-height:1; padding:4px;">✕</button>
      </div>
      <div id="fullMap" style="flex:1;"></div>
      <div style="padding:16px 18px calc(16px + env(safe-area-inset-bottom)); flex-shrink:0;">
        <div style="height:6px; background:var(--line); border-radius:4px; overflow:hidden; margin-bottom:10px;">
          <div id="transitProgressFill" style="height:100%; width:0%; background:var(--amber); transition:width 0.6s ease;"></div>
        </div>
        <div style="font-weight:700; color:var(--teal-dark); font-size:14px;" id="fullMapEtaText">Calculating…</div>
      </div>
    </div>
  `;

  document.getElementById('closeMapBtn').addEventListener('click', closeMapModal);

  const pickupIcon = L.divIcon({
    className: '',
    html: '<div style="width:18px;height:18px;border-radius:50%;background:#2F8F5B;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.3);"></div>',
    iconSize: [18,18], iconAnchor: [9,9]
  });
  const dropoffIcon = L.divIcon({
    className: '',
    html: '<div style="font-size:20px;line-height:1;">🏁</div>',
    iconSize: [20,20], iconAnchor: [10,20]
  });

  const fmap = L.map('fullMap', { zoomControl: true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(fmap);

  L.marker([o.pickup.lat, o.pickup.lng], { icon: pickupIcon, title: 'Pickup: ' + o.pickup.address }).addTo(fmap);
  L.marker([o.dropoff.lat, o.dropoff.lng], { icon: dropoffIcon, title: 'Drop-off: ' + o.dropoff.address }).addTo(fmap);

  // Faint full-length track line, plus a colored overlay line that grows
  // with progress — the "transit path" fill, drawn straight since this
  // app uses straight-line distance throughout.
  L.polyline([[o.pickup.lat, o.pickup.lng], [o.dropoff.lat, o.dropoff.lng]], {
    color: '#C7BFB2', weight: 5, opacity: 0.6
  }).addTo(fmap);
  progressLineRef = L.polyline([[o.pickup.lat, o.pickup.lng], [o.pickup.lat, o.pickup.lng]], {
    color: '#F0A93A', weight: 5
  }).addTo(fmap);

  fmap.fitBounds([[o.pickup.lat, o.pickup.lng], [o.dropoff.lat, o.dropoff.lng]], { padding: [50, 50] });
  setTimeout(()=> fmap.invalidateSize(), 50);
  fullMapRef = fmap;

  const secsLeft = etaDeadlineMs !== null ? Math.max(0, Math.round((etaDeadlineMs - Date.now()) / 1000)) : 0;
  renderTransitProgress(secsLeft);
}

function closeMapModal(){
  mapModalOpen = false;
  if(fullMapRef){ fullMapRef.remove(); fullMapRef = null; }
  progressLineRef = null;
  document.getElementById('mapModalRoot').innerHTML = '';
}

/* Same destination logic as active-delivery.html: head to pickup
   until picked up, then head to drop-off. */
function updateEtaDisplay(o){
  currentActiveOrder = o;
  document.getElementById('viewMapBtn').style.display = 'inline-flex';

  const etaBanner = document.getElementById('etaBanner');
  const arrivedBanner = document.getElementById('arrivedBanner');

  if(o.status === 'confirmed' && o.arrivedAtPickup){
    etaBanner.style.display = 'none';
    stopEtaCountdown();
    arrivedBanner.style.display = 'block';
    document.getElementById('arrivedTime').textContent = o.arrivedAtPickupAt ? timeAgo(o.arrivedAtPickupAt) : '';
    etaPhase = '';
    return;
  }
  arrivedBanner.style.display = 'none';

  const dest = o.status === 'in_progress' ? o.dropoff : o.pickup;
  etaPhase = o.status === 'in_progress' ? 'dropoff' : 'pickup';

  if(o.riderLocation && dest){
    const km = distanceKmBetween(o.riderLocation, { lat: dest.lat, lng: dest.lng });
    const mins = Math.max(1, Math.round((km / 25) * 60)); // same assumed 25km/h speed used elsewhere
    etaBanner.style.display = 'block';
    document.getElementById('etaSub').textContent = `${km.toFixed(1)} km to ${o.status === 'in_progress' ? 'drop-off' : 'pickup'}`;
    // Recalibrate the countdown deadline against this fresh location fix.
    etaDeadlineMs = Date.now() + mins * 60000;
    etaTotalMs = mins * 60000;
    startEtaCountdown();
  } else {
    etaBanner.style.display = 'none';
    stopEtaCountdown();
  }
}

document.getElementById('viewMapBtn').addEventListener('click', ()=>{
  if(currentActiveOrder) openMapModal(currentActiveOrder);
});

requireAuth(async user=>{
  currentUser = user;
  const doc = await db.collection('users').doc(user.uid).get();
  if(!doc.exists || doc.data().role !== 'rider'){
    await auth.signOut();
    window.location.href = "index.html";
    return;
  }
  listenToActiveDelivery();
  listenToPastOrders();
  watchForRiderConfirmations(user.uid);
  watchWalletBalance('walletBalanceHeader', user.uid, (bal)=>{
    const pill = document.getElementById('walletPill');
    const warn = document.getElementById('walletWarn');
    const isLow = bal < LOW_BALANCE_THRESHOLD;
    pill.classList.toggle('low', isLow);
    warn.style.display = isLow ? 'inline' : 'none';
  });
});

function listenToActiveDelivery(){
  db.collection('orders')
    .where('riderId','==', currentUser.uid)
    .where('status','in', ['confirmed','in_progress'])
    .onSnapshot(snap=>{
      const section = document.getElementById('activeSection');
      if(snap.empty){
        section.style.display = 'none';
        document.getElementById('etaBanner').style.display = 'none';
        document.getElementById('arrivedBanner').style.display = 'none';
        document.getElementById('viewMapBtn').style.display = 'none';
        stopEtaCountdown();
        currentActiveOrder = null;
        if(mapModalOpen) closeMapModal();
        return;
      }
      const doc = snap.docs[0];
      const o = doc.data();
      section.style.display = 'block';
      document.getElementById('activeCard').innerHTML = `
        <a href="active-delivery.html?id=${doc.id}" style="text-decoration:none; color:inherit;">
          <div class="order-card">
            <div class="top-row">
              <span class="service-tag">${serviceLabel(o.serviceType)}</span>
              <span class="fare-tag">${fmtPeso(o.fare)}</span>
            </div>
            <div class="route">📍 ${o.pickup.address}</div>
            <div class="route">🎯 ${o.dropoff.address}</div>
            ${o.notes ? `<div class="notes">"${o.notes}"</div>` : ''}
            <span class="status-badge status-${o.status}">${o.status.replace('_',' ')}</span>
            <div class="hint" style="margin-top:10px;">Tap for map &amp; directions →</div>
          </div>
        </a>
      `;

      updateEtaDisplay(o);
    });
}

let allPastOrders = [];
let activePastCategory = 'all';

function listenToPastOrders(){
  db.collection('orders')
    .where('riderId','==', currentUser.uid)
    .where('status','in', ['completed','cancelled'])
    .orderBy('createdAt','desc')
    .onSnapshot(snap=>{
      allPastOrders = snap.docs;
      renderPastOrders();
    }, err=>{
      document.getElementById('pastList').innerHTML =
        `<div class="empty-state">Couldn't load history. Check the browser console for a Firestore index link if this is your first time here.</div>`;
    });
}

function renderPastOrders(){
  const list = document.getElementById('pastList');
  const filtered = activePastCategory === 'all'
    ? allPastOrders
    : allPastOrders.filter(doc=> doc.data().serviceType === activePastCategory);

  if(filtered.length === 0){
    list.innerHTML = `<div class="empty-state"><div class="glyph">📦</div>No completed deliveries in this category yet.</div>`;
    return;
  }
  list.innerHTML = '';
  filtered.forEach(doc=>{
    const o = doc.data();
    const card = document.createElement('div');
    card.className = 'order-card';
    card.innerHTML = `
      <div class="top-row">
        <span class="service-tag">${serviceLabel(o.serviceType)}</span>
        <span class="fare-tag">${fmtPeso(o.fare)}</span>
      </div>
      <div class="route">📍 ${o.pickup.address}</div>
      <div class="route">🎯 ${o.dropoff.address}</div>
      <span class="status-badge status-${o.status}">${o.status.replace('_',' ')}</span>
    `;
    list.appendChild(card);
  });
}

document.getElementById('pastFilters').querySelectorAll('.filter-chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    activePastCategory = chip.dataset.category;
    document.getElementById('pastFilters').querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    renderPastOrders();
  });
});

document.getElementById('logoutLink').addEventListener('click', async (e)=>{
  e.preventDefault();
  await auth.signOut();
  window.location.href = "index.html";
});

window.addEventListener('beforeunload', ()=>{
  stopEtaCountdown();
  if(mapModalOpen) closeMapModal();
});
</script>
</body>
</html>
