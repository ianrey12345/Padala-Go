<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Padala Rider">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0C4A45">
<title>Become a Rider · Padala Go</title>
<link rel="stylesheet" href="../shared/styles.css">
<style>
  /* Terms/Privacy float panel — opens in place instead of navigating to
     a separate page, so this form (and any photos already picked) is
     never unloaded. */
  .legal-modal-overlay{
    position:fixed; inset:0; background:rgba(8,47,43,0.75); z-index:2000;
    display:none; align-items:flex-end; justify-content:center;
  }
  .legal-modal-panel{
    background:var(--paper); width:100%; max-width:480px; max-height:88vh;
    border-radius:20px 20px 0 0; display:flex; flex-direction:column;
    box-shadow:0 -6px 24px rgba(0,0,0,0.3); animation:legalSlideUp .2s ease-out;
  }
  @keyframes legalSlideUp{ from{ transform:translateY(24px); opacity:0.4; } to{ transform:translateY(0); opacity:1; } }
  .legal-modal-topbar{
    background:var(--teal); color:#fff; padding:14px 16px; border-radius:20px 20px 0 0;
    display:flex; align-items:center; gap:10px; flex-shrink:0;
  }
  .legal-modal-back{
    background:rgba(255,255,255,0.15); border:none; color:#fff; border-radius:10px;
    padding:8px 12px; font-size:13px; font-weight:700; cursor:pointer; flex-shrink:0;
  }
  .legal-modal-title{ font-family:'Sora'; font-weight:700; font-size:15.5px; flex:1; }
  .legal-modal-body{ padding:18px 20px calc(24px + env(safe-area-inset-bottom)); overflow-y:auto; }
  .legal-modal-body .legal-content h2{ color:var(--teal-dark); font-size:16px; }
  .legal-modal-body .legal-content p{ font-size:13.5px; line-height:1.6; color:var(--ink); margin:6px 0 0; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="content auth-wrap">
    <div class="brand-mark">
      <div class="dot" style="background:var(--teal); color:#fff;">P</div>
      <span>Padala Go <span style="color:var(--amber);">Rider</span></span>
    </div>

    <h1>Become a rider</h1>
    <p style="color:#6C7A78; font-size:14px; margin-top:0;">Create your rider account.</p>

    <div id="errorBanner" class="error-banner"></div>
    <div id="draftRestoredBanner" class="success-banner"></div>

    <form id="signupForm" style="margin-top:20px;">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="Juan Dela Cruz" required>
      </div>
      <div class="field">
        <label for="phone">Mobile number</label>
        <input type="tel" id="phone" placeholder="09XX XXX XXXX" required>
      </div>
      <div class="field">
        <label for="plate">Motorbike plate number</label>
        <input type="text" id="plate" placeholder="e.g. ABC 1234" required>
      </div>
      <div class="field">
        <label for="motorColor">Motorbike color</label>
        <input type="text" id="motorColor" placeholder="e.g. Red" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@email.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" minlength="6" required>
      </div>

      <div class="field">
        <label for="profilePhoto">Profile picture</label>
        <input type="file" id="profilePhoto" accept="image/*" capture="user" required>
        <img id="profilePhotoPreview" style="display:none; margin-top:8px; width:88px; height:88px; border-radius:50%; object-fit:cover; border:1.5px solid var(--line);">
      </div>
      <div class="field">
        <label for="licenseFront">Driver's license — front</label>
        <input type="file" id="licenseFront" accept="image/*" capture="environment" required>
        <img id="licenseFrontPreview" style="display:none; margin-top:8px; width:100%; max-width:260px; border-radius:10px; border:1.5px solid var(--line);">
      </div>
      <div class="field">
        <label for="licenseBack">Driver's license — back</label>
        <input type="file" id="licenseBack" accept="image/*" capture="environment" required>
        <img id="licenseBackPreview" style="display:none; margin-top:8px; width:100%; max-width:260px; border-radius:10px; border:1.5px solid var(--line);">
      </div>

      <div style="display:flex; align-items:flex-start; gap:10px; margin:18px 0 6px;">
        <input type="checkbox" id="agreeTerms" required style="margin-top:3px; width:16px; height:16px; flex-shrink:0; accent-color:var(--teal);">
        <label for="agreeTerms" style="font-size:12.5px; color:#6C7A78; font-weight:400; line-height:1.4;">
          By checking this box, I agree to the <a href="terms.html" class="legal-link" data-title="Terms of Service" style="color:var(--teal); font-weight:600;">Terms of Service</a> and <a href="privacy.html" class="legal-link" data-title="Privacy Policy" style="color:var(--teal); font-weight:600;">Privacy Policy</a>, and consent to the processing of my personal information as described therein.
        </label>
      </div>

      <button type="submit" class="btn btn-primary" id="signUpBtn" disabled>Sign Up</button>
    </form>

    <p style="text-align:center; font-size:13.5px; color:#6C7A78; margin-top:18px;">
      Already a rider? <a href="index.html" style="color:var(--teal); font-weight:600;">Sign in</a>
    </p>
  </div>
</div>

<div class="legal-modal-overlay" id="legalModalOverlay">
  <div class="legal-modal-panel">
    <div class="legal-modal-topbar">
      <button type="button" class="legal-modal-back" id="legalModalBackBtn">← Back</button>
      <div class="legal-modal-title" id="legalModalTitle"></div>
    </div>
    <div class="legal-modal-body" id="legalModalBody">
      <div class="empty-state">Loading…</div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script>
const form = document.getElementById('signupForm');
const errorBanner = document.getElementById('errorBanner');
const signUpBtn = document.getElementById('signUpBtn');
const agreeTermsCheckbox = document.getElementById('agreeTerms');

// Sign Up stays disabled until the box is checked.
agreeTermsCheckbox.addEventListener('change', ()=>{
  signUpBtn.disabled = !agreeTermsCheckbox.checked;
  saveDraft();
});

/* ---------------------------------------------------------
   Draft persistence — the Terms/Privacy links below open with
   target="_blank", which behaves like a real new tab in a normal
   browser (this tab is untouched). But in a home-screen-installed PWA
   there are no real tabs, so it navigates away in place, and coming
   "back" is a full reload of this page — wiping out anything already
   entered. sessionStorage survives that reload (it only clears when the
   tab/app is fully closed), so every keystroke on the text fields is
   mirrored there and restored on load.
   Two things are deliberately NOT restorable here:
   - Password: not saved, so nothing sensitive sits in storage even
     session-scoped — worth a quick re-type.
   - The three photo uploads: browsers block setting a file input's
     value via script for security, on every browser, with no
     workaround — so those genuinely have to be re-selected. The banner
     below tells the rider that plainly instead of leaving them to
     wonder why the previews are blank.
   --------------------------------------------------------- */
const DRAFT_KEY = 'padalaSignupDraft_rider';
const DRAFT_FIELD_IDS = ['name', 'phone', 'plate', 'motorColor', 'email'];
const draftRestoredBanner = document.getElementById('draftRestoredBanner');

function saveDraft(){
  const draft = {};
  DRAFT_FIELD_IDS.forEach(id=>{ draft[id] = document.getElementById(id).value; });
  draft.agreeTerms = agreeTermsCheckbox.checked;
  try{ sessionStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); } catch(e){ /* storage unavailable — draft just won't persist */ }
}

function restoreDraft(){
  let draft;
  try{
    const raw = sessionStorage.getItem(DRAFT_KEY);
    if(!raw) return;
    draft = JSON.parse(raw);
  } catch(e){ return; }

  let restoredAnything = false;
  DRAFT_FIELD_IDS.forEach(id=>{
    if(draft[id]){
      document.getElementById(id).value = draft[id];
      restoredAnything = true;
    }
  });
  if(draft.agreeTerms){
    agreeTermsCheckbox.checked = true;
    signUpBtn.disabled = false;
  }

  if(restoredAnything){
    draftRestoredBanner.textContent = "Welcome back — we restored what you'd typed. Please re-select your profile photo and license photos below, though — browsers don't allow those to be saved automatically.";
    draftRestoredBanner.style.display = 'block';
  }
}

function clearDraft(){
  try{ sessionStorage.removeItem(DRAFT_KEY); } catch(e){}
}

restoreDraft();
DRAFT_FIELD_IDS.forEach(id=>{
  document.getElementById(id).addEventListener('input', saveDraft);
});

/* ---------------------------------------------------------
   Terms/Privacy float panel — fetches the target page's own
   .legal-content and drops it into the panel body, so there's one
   source of truth (terms.html / privacy.html still work standalone
   too) but opening them from Sign Up never navigates this page away —
   which also means the three photo pickers above never get reset just
   from checking one of these before agreeing.
   --------------------------------------------------------- */
const legalModalOverlay = document.getElementById('legalModalOverlay');
const legalModalTitle = document.getElementById('legalModalTitle');
const legalModalBody = document.getElementById('legalModalBody');
const legalContentCache = {};

async function openLegalModal(url, title){
  legalModalTitle.textContent = title;
  legalModalOverlay.style.display = 'flex';
  document.body.style.overflow = 'hidden';

  if(legalContentCache[url]){
    legalModalBody.innerHTML = legalContentCache[url];
    return;
  }
  legalModalBody.innerHTML = `<div class="empty-state">Loading…</div>`;
  try{
    const res = await fetch(url);
    const html = await res.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const content = doc.querySelector('.legal-content');
    const inner = content
      ? content.innerHTML
      : `<p>Couldn't load this page. <a href="${url}" target="_blank">Open it directly</a> instead.</p>`;
    legalContentCache[url] = inner;
    legalModalBody.innerHTML = inner;
  } catch(err){
    legalModalBody.innerHTML = `<p>Couldn't load this page. <a href="${url}" target="_blank">Open it directly</a> instead.</p>`;
  }
}

function closeLegalModal(){
  legalModalOverlay.style.display = 'none';
  document.body.style.overflow = '';
}

document.getElementById('legalModalBackBtn').addEventListener('click', closeLegalModal);
legalModalOverlay.addEventListener('click', (e)=>{
  if(e.target === legalModalOverlay) closeLegalModal();
});
document.querySelectorAll('.legal-link').forEach(link=>{
  link.addEventListener('click', (e)=>{
    e.preventDefault();
    openLegalModal(link.getAttribute('href'), link.dataset.title);
  });
});

// Free image hosting via Cloudinary's unsigned upload API — no backend
// server needed, safe to call directly from the browser. CLOUD_NAME and
// UPLOAD_PRESET are both public identifiers (not secrets): the upload
// preset is what actually enforces "unsigned, images only" server-side
// in the Cloudinary dashboard, so exposing these two values in client
// code is the intended, documented way to use this API.
const CLOUDINARY_CLOUD_NAME = "umvf8y2h";
const CLOUDINARY_UPLOAD_PRESET = "RideandGO";

// Wire each file input to show a preview thumbnail as soon as a photo is picked.
[
  ['profilePhoto', 'profilePhotoPreview'],
  ['licenseFront', 'licenseFrontPreview'],
  ['licenseBack', 'licenseBackPreview']
].forEach(([inputId, previewId])=>{
  document.getElementById(inputId).addEventListener('change', (e)=>{
    const file = e.target.files[0];
    const preview = document.getElementById(previewId);
    if(!file){ preview.style.display = 'none'; return; }
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
  });
});

// Uploads one file to Cloudinary and resolves to its public HTTPS URL,
// which is what gets stored on the rider's user doc — same shape as the
// old Firebase Storage version, just a different backend behind it.
async function uploadRiderDoc(uid, filename, file){
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  // Folders riderDocuments/{uid} keep each rider's three photos grouped
  // together in the Cloudinary media library, same layout as before.
  formData.append('folder', `riderDocuments/${uid}`);
  formData.append('public_id', filename.replace(/\.[^/.]+$/, ''));

  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
    method: 'POST',
    body: formData
  });
  if(!res.ok){
    throw new Error(`Cloudinary upload failed (${res.status})`);
  }
  const data = await res.json();
  return data.secure_url;
}

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  errorBanner.style.display = "none";

  if(!agreeTermsCheckbox.checked){
    errorBanner.textContent = "Please agree to the Terms of Service and Privacy Policy to continue.";
    errorBanner.style.display = "block";
    return;
  }

  signUpBtn.disabled = true;
  signUpBtn.innerHTML = '<span class="spinner"></span> Creating account…';

  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const plate = document.getElementById('plate').value.trim();
  const motorColor = document.getElementById('motorColor').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const profilePhotoFile = document.getElementById('profilePhoto').files[0];
  const licenseFrontFile = document.getElementById('licenseFront').files[0];
  const licenseBackFile = document.getElementById('licenseBack').files[0];

  let cred;
  try{
    cred = await auth.createUserWithEmailAndPassword(email, password);
  } catch(err){
    errorBanner.textContent = friendlyError(err.code);
    errorBanner.style.display = "block";
    signUpBtn.disabled = false;
    signUpBtn.textContent = "Sign Up";
    return;
  }

  // Account exists at this point — uploads happen next. If any of these
  // fail (e.g. flaky connection), the account is still created but the
  // photos won't be attached; the error message says so explicitly so
  // the rider knows to retry from a page that lets them re-upload rather
  // than assuming signup failed outright.
  try{
    signUpBtn.innerHTML = '<span class="spinner"></span> Uploading photos…';
    const [profilePhotoUrl, licenseFrontUrl, licenseBackUrl] = await Promise.all([
      uploadRiderDoc(cred.user.uid, 'profile.jpg', profilePhotoFile),
      uploadRiderDoc(cred.user.uid, 'license-front.jpg', licenseFrontFile),
      uploadRiderDoc(cred.user.uid, 'license-back.jpg', licenseBackFile)
    ]);

    await db.collection('users').doc(cred.user.uid).set({
      name, phone, plate, motorColor, email,
      role: 'rider',
      walletBalance: 0,
      profilePhotoUrl, licenseFrontUrl, licenseBackUrl,
      verificationStatus: 'pending',
      agreedToTermsAt: firebase.firestore.FieldValue.serverTimestamp(),
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await cred.user.sendEmailVerification().catch(()=>{});
    clearDraft();
    window.location.href = "verify-email.html";
  } catch(err){
    errorBanner.textContent = "Your account was created, but we couldn't upload your photos. Please sign in and try again from Menu.";
    errorBanner.style.display = "block";
    signUpBtn.disabled = false;
    signUpBtn.textContent = "Sign Up";
  }
});

function friendlyError(code){
  switch(code){
    case 'auth/email-already-in-use': return "That email is already registered. Try signing in instead.";
    case 'auth/invalid-email': return "That email address doesn't look right.";
    case 'auth/weak-password': return "Password should be at least 6 characters.";
    default: return "Couldn't create your account. Please check your details and try again.";
  }
}
</script>
<script src="../shared/ios-install-banner.js"></script>
<script src="../shared/password-toggle.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(err => {
      console.error('Service worker registration failed:', err);
    });
  });
}
</script>
</body>
</html>
