<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat · Padala Go Rider</title>
<link rel="stylesheet" href="../shared/styles.css">
<style>
  .chat-row-wrap{ position:relative; }
  .unread-dot{
    position:absolute; top:14px; right:14px;
    width:10px; height:10px; border-radius:50%; background:var(--red);
    box-shadow:0 0 0 2px #fff;
  }
  .tabbar a{ position:relative; }
  .tab-badge-dot{
    position:absolute; top:2px; right:calc(50% - 20px);
    width:8px; height:8px; border-radius:50%; background:var(--red);
    box-shadow:0 0 0 2px var(--paper);
  }
</style>
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="eyebrow">Padala Go Rider</div>
    <h1>Chat</h1>
    <div class="sub">Talk to other riders, or your client once you're confirmed</div>
  </div>

  <div class="content">
    <div class="menu-section">
      <div class="menu-section-title">Community</div>
      <a href="chat-thread.html?type=community" class="menu-row">
        <span class="row-label">📢 Riders Chat</span>
        <span class="row-right"><span class="chevron">›</span></span>
      </a>
    </div>

    <h3 style="font-size:15px; margin-bottom:8px;">Client Chats</h3>
    <div id="clientChatsList">
      <div class="empty-state">Loading…</div>
    </div>
  </div>

  <div class="tabbar">
    <a href="orders.html"><span class="g">🏍️</span>Deliveries</a>
    <a href="current.html"><span class="g">📋</span>Current</a>
    <a href="chat.html" class="active"><span class="g">💬</span>Chat<span id="chatTabBadge" class="tab-badge-dot" style="display:none;"></span></a>
    <a href="map.html"><span class="g">🗺️</span>Map</a>
    <a href="menu.html"><span class="g">☰</span>Menu</a>
    <a href="#" id="logoutLink"><span class="g">🚪</span>Log Out</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script>
function serviceLabel(s){ return s === 'padala_pabili' ? 'Padala / Pabili' : 'Bike Delivery'; }

requireAuth(async user=>{
  const doc = await db.collection('users').doc(user.uid).get();
  if(!doc.exists || doc.data().role !== 'rider'){
    await auth.signOut();
    window.location.href = "index.html";
    return;
  }
  watchForRiderConfirmations(user.uid);
  watchForOrderCancellations(user.uid);
  watchForNewMessages(user.uid, (unreadCount)=>{
    const badge = document.getElementById('chatTabBadge');
    if(badge) badge.style.display = unreadCount > 0 ? 'block' : 'none';
  });

  // Client chat unlocks only for orders this rider has actually been
  // confirmed on — matches "if the rider accept the client".
  db.collection('orders')
    .where('riderId','==', user.uid)
    .where('status','in', ['confirmed','in_progress','completed'])
    .orderBy('createdAt','desc')
    .onSnapshot(async snap=>{
      const container = document.getElementById('clientChatsList');
      if(snap.empty){
        container.innerHTML = `<div class="empty-state"><div class="glyph">💬</div>Client chat unlocks once you're confirmed on a delivery.</div>`;
        return;
      }
      container.innerHTML = '';
      for(const orderDoc of snap.docs){
        const o = orderDoc.data();
        let clientName = 'Client';
        try{
          const custDoc = await db.collection('users').doc(o.customerId).get();
          if(custDoc.exists) clientName = custDoc.data().name || 'Client';
        } catch(e){ /* fall back to default label */ }

        let isUnread = false;
        try{
          const lastMsgSnap = await db.collection('orders').doc(orderDoc.id).collection('messages')
            .orderBy('createdAt','desc').limit(1).get();
          if(!lastMsgSnap.empty){
            const lastMsg = lastMsgSnap.docs[0].data();
            if(lastMsg.senderId !== user.uid && lastMsg.createdAt){
              isUnread = lastMsg.createdAt.toMillis() > getChatLastRead(orderDoc.id);
            }
          }
        } catch(e){ /* leave unread state as false if this lookup fails */ }

        const card = document.createElement('a');
        card.href = `chat-thread.html?type=client&id=${orderDoc.id}`;
        card.style.textDecoration = 'none';
        card.style.color = 'inherit';
        card.className = 'chat-row-wrap';
        card.innerHTML = `
          <div class="order-card">
            <div class="top-row">
              <span class="service-tag">${serviceLabel(o.serviceType)}</span>
              <span class="status-badge status-${o.status}">${o.status.replace('_',' ')}</span>
            </div>
            <div class="route">🙋 Chat with ${clientName}</div>
            <div class="route">📍 ${o.pickup.address}</div>
          </div>
          ${isUnread ? `<span class="unread-dot"></span>` : ''}
        `;
        container.appendChild(card);
      }
    }, err=>{
      document.getElementById('clientChatsList').innerHTML =
        `<div class="empty-state">Couldn't load chats. Check the browser console for a Firestore index link if this is your first time here.</div>`;
    });
});

document.getElementById('logoutLink').addEventListener('click', async (e)=>{
  e.preventDefault();
  await auth.signOut();
  window.location.href = "index.html";
});
</script>
</body>
</html>
