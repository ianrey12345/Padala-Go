<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu · Padala Go Rider</title>
<link rel="stylesheet" href="../shared/styles.css">
<style>
  .rider-rating{ font-size:12px; color:#8A8178; margin-top:3px; }
  .rider-rating .stars{ color:var(--amber); letter-spacing:1px; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="eyebrow">Padala Go Rider</div>
    <h1 id="greeting">Menu</h1>
    <div class="sub">Wallet, earnings & account</div>
  </div>

  <div class="content">
    <div class="menu-section">
      <div class="menu-section-title">Money</div>
      <a href="wallet.html" class="menu-row">
        <span class="row-label">💰 Wallet</span>
        <span class="row-right"><span class="row-count" id="walletBalanceRow">₱0</span><span class="chevron">›</span></span>
      </a>
    </div>

    <div class="menu-section">
      <div class="menu-section-title">Account</div>
      <div class="menu-row" id="riderNameRow">
        <div>
          <span class="row-label" id="riderName">—</span>
          <div class="rider-rating" id="riderRating">—</div>
        </div>
        <span class="row-right"><span class="chevron"></span></span>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <a href="orders.html"><span class="g">🏍️</span>Deliveries</a>
    <a href="current.html"><span class="g">📋</span>Current</a>
    <a href="chat.html"><span class="g">💬</span>Chat</a>
    <a href="map.html"><span class="g">🗺️</span>Map</a>
    <a href="menu.html" class="active"><span class="g">☰</span>Menu</a>
    <a href="#" id="logoutLink"><span class="g">🚪</span>Log Out</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script>
requireAuth(async (user)=>{
  const doc = await db.collection('users').doc(user.uid).get();
  if(!doc.exists || doc.data().role !== 'rider'){
    await auth.signOut();
    window.location.href = "index.html";
    return;
  }
  document.getElementById('riderName').textContent = doc.data().name || 'Rider';

  // Live-update the rating as new ones come in while this page is open.
  // Ratings live in an immutable per-rider subcollection (not a running
  // total on the user doc itself) — see the Firestore rules for why.
  db.collection('users').doc(user.uid).collection('ratings').onSnapshot(snap=>{
    renderRiderRating(snap);
  });

  watchWalletBalance('walletBalanceRow', user.uid);
  watchForRiderConfirmations(user.uid);
  watchForOrderCancellations(user.uid);
  watchForNewMessages(user.uid);
});

// Each doc in the subcollection is one customer's rating (see
// customer/order-status.html) — 5-star scale, 5 is best.
function renderRiderRating(snap){
  const el = document.getElementById('riderRating');
  if(snap.empty){
    el.textContent = 'No ratings yet';
    return;
  }
  let sum = 0;
  snap.forEach(d=> sum += d.data().rating);
  const avg = (sum / snap.size).toFixed(2);
  el.innerHTML = `<span class="stars">★</span> ${avg} <span style="opacity:0.75;">(${snap.size} rating${snap.size === 1 ? '' : 's'})</span>`;
}

document.getElementById('logoutLink').addEventListener('click', async (e)=>{
  e.preventDefault();
  await auth.signOut();
  window.location.href = "index.html";
});
</script>
</body>
</html>
