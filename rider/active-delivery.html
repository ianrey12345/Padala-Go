<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Padala Rider">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0C4A45">
<title>Redirecting… · Padala Go</title>
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
<div class="app-shell">
  <div class="content" style="display:flex; align-items:center; justify-content:center; min-height:100vh;">
    <div style="text-align:center; color:#8A8178;">
      <span class="spinner" style="border-top-color:var(--teal); border-color:rgba(12,74,69,0.2);"></span>
      <p style="margin-top:12px;">This page has moved to the <a href="map.html" style="color:var(--teal); font-weight:600;">Map tab</a>…</p>
    </div>
  </div>
</div>
<script>
// active-delivery.html is superseded by the persistent Map tab (map.html),
// which finds the rider's active delivery on its own — kept here as a
// redirect so any old bookmarks or links still land somewhere useful.
window.location.replace('map.html');
</script>
<script src="../shared/ios-install-banner.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(err => {
      console.error('Service worker registration failed:', err);
    });
  });
}
</script>
</body>
</html>
