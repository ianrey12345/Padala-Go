<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Active Delivery · Padala Go</title>
<link rel="stylesheet" href="../shared/styles.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  #map{height:320px;}
  .stage-banner{
    background:var(--paper); border-radius:14px; padding:14px 16px; margin-top:14px;
    box-shadow:var(--shadow); display:flex; align-items:center; gap:12px;
  }
  .stage-banner .glyph{font-size:22px;}
  .stage-banner .txt{font-size:13.5px; font-weight:600; color:var(--teal-dark);}
  .stage-banner .sub{font-size:12px; color:#8A8178; margin-top:1px;}
  .eta-pill{
    display:inline-block; background:var(--cream); color:var(--teal-dark);
    font-family:'Space Mono'; font-size:12.5px; padding:4px 10px; border-radius:20px; margin-top:8px;
  }
  .map-legend{display:flex; gap:16px; font-size:12.5px; margin-top:10px; color:#586866;}
</style>
</head>
<body>
<div class="app-shell">
  <div class="topbar plain">
    <a href="orders.html" class="back">← Deliveries</a>
    <h1 style="color:#fff; font-size:19px;">Active Delivery</h1>
  </div>

  <div class="content">
    <div id="map"></div>
    <div class="map-legend">
      <span><span class="pin-dot" style="background:#F0A93A;"></span>You</span>
      <span><span class="pin-dot" style="background:#2F8F5B;"></span>Pickup</span>
      <span>🏁 Drop-off</span>
    </div>
    <div class="hint" id="locationWarning" style="display:none; color:var(--red);"></div>
    <div class="eta-pill" id="etaPill" style="display:none;"></div>
    <div class="hint">Straight-line distance shown — actual road distance may differ.</div>

    <a href="#" class="btn btn-primary" id="navigateBtn" style="margin-top:12px; display:none; text-decoration:none;">
      🧭 Open Turn-by-Turn Directions
    </a>

    <div class="stage-banner" id="stageBanner">
      <div class="glyph">📍</div>
      <div>
        <div class="txt" id="stageText">Loading order…</div>
        <div class="sub" id="stageSub"></div>
      </div>
    </div>

    <div class="order-card" style="margin-top:14px;" id="orderCard"></div>

    <button type="button" class="btn btn-amber" id="actionBtn" style="margin-top:16px; display:none;"></button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const orderId = params.get('id');
let currentUser = null;
let orderData = null;
let map, riderMarker, pickupMarker, dropoffMarker, straightLine, watchId;

// Assumed average speed for a motorbike in city/mixed traffic, used only
// to estimate ETA from straight-line distance (no Directions API needed).
const ASSUMED_SPEED_KMH = 25;

function serviceLabel(s){ return s === 'padala_pabili' ? 'Padala / Pabili' : 'Bike Delivery'; }

/* ---------------------------------------------------------
   Live ticking ETA countdown — same pattern as the customer's
   order-status page, so both sides see a matching, per-second
   "arriving in Xm Ys" readout. Recalibrated against a fresh
   deadline every time a new GPS fix updates the distance.
   --------------------------------------------------------- */
let etaDeadlineMs = null;
let etaCountdownTimer = null;
let etaDistanceKm = null;

function startEtaCountdown(){
  if(etaCountdownTimer) return; // already ticking — recalibration just moved the deadline
  tickEtaCountdown();
  etaCountdownTimer = setInterval(tickEtaCountdown, 1000);
}

function stopEtaCountdown(){
  if(etaCountdownTimer){
    clearInterval(etaCountdownTimer);
    etaCountdownTimer = null;
  }
  etaDeadlineMs = null;
  etaDistanceKm = null;
}

function tickEtaCountdown(){
  const pill = document.getElementById('etaPill');
  if(!pill || etaDeadlineMs === null) return;
  const secsLeft = Math.max(0, Math.round((etaDeadlineMs - Date.now()) / 1000));
  const distTxt = etaDistanceKm !== null ? `${etaDistanceKm.toFixed(1)} km · ` : '';
  if(secsLeft <= 0){
    pill.textContent = `${distTxt}Arriving any moment…`;
  } else {
    const m = Math.floor(secsLeft / 60);
    const s = secsLeft % 60;
    pill.textContent = m > 0
      ? `${distTxt}Arriving in ${m}m ${s.toString().padStart(2,'0')}s`
      : `${distTxt}Arriving in ${s}s`;
  }
}

requireAuth(user=>{
  currentUser = user;
  if(!orderId){ window.location.href = "orders.html"; return; }
  listenToOrder();
});

const riderIcon = L.divIcon({
  className: '',
  html: '<div style="width:16px;height:16px;border-radius:50%;background:#F0A93A;border:2px solid #082F2B;box-shadow:0 0 0 2px #fff;"></div>',
  iconSize: [16,16], iconAnchor: [8,8]
});
const pickupIcon = L.divIcon({
  className: '',
  html: '<div style="width:18px;height:18px;border-radius:50%;background:#2F8F5B;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.3);"></div>',
  iconSize: [18,18], iconAnchor: [9,9]
});
const dropoffIcon = L.divIcon({
  className: '',
  html: '<div style="font-size:20px;line-height:1;">🏁</div>',
  iconSize: [20,20], iconAnchor: [10,20]
});

function initMap(){
  map = L.map('map', { zoomControl: true }).setView([14.6760, 121.0437], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  if(navigator.geolocation){
    watchId = navigator.geolocation.watchPosition(pos=>{
      hideLocationWarning();
      const riderPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      updateRiderMarker(riderPos);
      if(orderData) updateRouteVisuals();
      broadcastRiderLocation(riderPos);
    }, err=>{
      showLocationWarning(err);
    }, { enableHighAccuracy: true });
  } else {
    showLocationWarning(null);
  }
}

function showLocationWarning(err){
  const el = document.getElementById('locationWarning');
  if(!el) return;
  if(err && err.code === err.PERMISSION_DENIED){
    el.textContent = "Location access is off — turn it on in your browser or phone settings so the customer can see your live location.";
  } else if(!navigator.geolocation){
    el.textContent = "This browser doesn't support location — the customer won't see your live position.";
  } else {
    el.textContent = "Couldn't get your location right now — check that location services are on.";
  }
  el.style.display = 'block';
}

function hideLocationWarning(){
  const el = document.getElementById('locationWarning');
  if(el) el.style.display = 'none';
}

let lastLocationWriteAt = 0;
function broadcastRiderLocation(pos){
  // Throttled to avoid writing to Firestore on every GPS tick — the customer's
  // ETA readout only needs an update every few seconds, not continuously.
  const now = Date.now();
  if(now - lastLocationWriteAt < 4000) return;
  lastLocationWriteAt = now;
  if(!orderId) return;
  db.collection('orders').doc(orderId).update({
    riderLocation: pos,
    riderLocationUpdatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(err=>{ console.warn('Could not broadcast rider location:', err); });
}

function updateRiderMarker(pos){
  const latlng = [pos.lat, pos.lng];
  if(!riderMarker){
    riderMarker = L.marker(latlng, { icon: riderIcon, title: 'You', zIndexOffset: 1000 }).addTo(map);
  } else {
    riderMarker.setLatLng(latlng);
  }
}

function currentDestination(){
  // Before picked up: head to pickup. After picked up: head to drop-off.
  if(orderData.status === 'in_progress'){
    return orderData.dropoff;
  }
  return orderData.pickup;
}

function ensurePickupDropoffMarkers(){
  if(!pickupMarker){
    pickupMarker = L.marker([orderData.pickup.lat, orderData.pickup.lng], {
      icon: pickupIcon, title: 'Pickup: ' + orderData.pickup.address
    }).addTo(map);
  }
  if(!dropoffMarker){
    dropoffMarker = L.marker([orderData.dropoff.lat, orderData.dropoff.lng], {
      icon: dropoffIcon, title: 'Drop-off: ' + orderData.dropoff.address
    }).addTo(map);
  }
}

function updateRouteVisuals(){
  const dest = currentDestination();
  if(!dest){
    stopEtaCountdown();
    return;
  }
  if(orderData.status === 'completed'){
    stopEtaCountdown();
    document.getElementById('etaPill').style.display = 'none';
    return;
  }

  ensurePickupDropoffMarkers();

  const boundsPoints = [
    [orderData.pickup.lat, orderData.pickup.lng],
    [orderData.dropoff.lat, orderData.dropoff.lng]
  ];

  if(riderMarker){
    const riderPos = riderMarker.getLatLng();
    boundsPoints.push([riderPos.lat, riderPos.lng]);

    // Straight line between rider and the CURRENT active point (pickup, then drop-off)
    if(straightLine) map.removeLayer(straightLine);
    straightLine = L.polyline([riderPos, [dest.lat, dest.lng]], {
      color: '#0C4A45', weight: 3, opacity: 0.7, dashArray: '4, 8'
    }).addTo(map);

    const km = distanceKmBetween({ lat: riderPos.lat, lng: riderPos.lng }, { lat: dest.lat, lng: dest.lng });
    const mins = Math.max(1, Math.round((km / ASSUMED_SPEED_KMH) * 60));
    document.getElementById('etaPill').style.display = 'inline-block';
    etaDistanceKm = km;
    // Recalibrate the countdown deadline against this fresh location fix —
    // keeps the per-second tick honest as the rider's actual position updates,
    // same approach the customer's order-status page uses.
    etaDeadlineMs = Date.now() + mins * 60000;
    startEtaCountdown();
  }

  map.fitBounds(boundsPoints, { padding: [60, 60] });
  updateNavigateLink(dest);
}

function updateNavigateLink(dest){
  const navBtn = document.getElementById('navigateBtn');
  const destParam = `${dest.lat},${dest.lng}`;
  // Deep-links to the Google Maps app (or maps.google.com in browser) for
  // real turn-by-turn navigation — this is a free URL, not the paid API.
  navBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${destParam}&travelmode=driving`;
  navBtn.target = "_blank";
  navBtn.style.display = 'block';
}

function listenToOrder(){
  db.collection('orders').doc(orderId).onSnapshot(doc=>{
    if(!doc.exists){
      document.getElementById('stageText').textContent = "Order not found.";
      return;
    }
    orderData = doc.data();

    if(orderData.riderId !== currentUser.uid){
      document.getElementById('stageText').textContent = "This delivery isn't assigned to you.";
      return;
    }

    renderOrderCard();
    renderStage(doc.ref);

    if(map){
      updateRouteVisuals();
    }
  });
}

function renderOrderCard(){
  const o = orderData;
  document.getElementById('orderCard').innerHTML = `
    <div class="top-row">
      <span class="service-tag">${serviceLabel(o.serviceType)}</span>
      <span class="fare-tag">${fmtPeso(o.fare)}</span>
    </div>
    <div class="route">📍 ${o.pickup.address}</div>
    <div class="route">🎯 ${o.dropoff.address}</div>
    ${o.notes ? `<div class="notes">"${o.notes}"</div>` : ''}
  `;
}

function renderStage(orderRef){
  const o = orderData;
  const stageText = document.getElementById('stageText');
  const stageSub = document.getElementById('stageSub');
  const actionBtn = document.getElementById('actionBtn');
  actionBtn.style.display = 'block';
  actionBtn.onclick = null;

  if(o.status === 'confirmed' && !o.arrivedAtPickup){
    stageText.textContent = "Heading to pickup point";
    stageSub.textContent = "Head toward the teal pin — that's the pickup location.";
    actionBtn.textContent = "I've Arrived at Pickup";
    actionBtn.className = "btn btn-amber";
    actionBtn.onclick = ()=> orderRef.update({
      arrivedAtPickup: true,
      arrivedAtPickupAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } else if(o.status === 'confirmed' && o.arrivedAtPickup){
    stageText.textContent = "Arrived at pickup point";
    stageSub.textContent = "Customer has been notified. Once you have the item, mark it picked up.";
    actionBtn.textContent = "Mark Picked Up";
    actionBtn.className = "btn btn-primary";
    actionBtn.onclick = ()=> orderRef.update({ status: 'in_progress' });
  } else if(o.status === 'in_progress'){
    stageText.textContent = "On the way to drop-off";
    stageSub.textContent = "Head toward the teal pin — that's the drop-off location.";
    actionBtn.textContent = "Mark Delivered";
    actionBtn.className = "btn btn-amber";
    actionBtn.onclick = async ()=>{
      actionBtn.disabled = true;
      actionBtn.textContent = "Completing…";
      try{
        const commission = await completeOrderWithCommission(orderId, currentUser.uid, o.fare);
        showToast(`Delivered! ${fmtPeso(commission)} commission (10%) deducted from your wallet.`);
      } catch(err){
        alert("Couldn't complete the delivery. Please check your connection and try again.");
        actionBtn.disabled = false;
        actionBtn.textContent = "Mark Delivered";
      }
    };
  } else if(o.status === 'completed'){
    stageText.textContent = "Delivery completed 🎉";
    stageSub.textContent = "Nice work!";
    actionBtn.style.display = 'none';
  }
}

window.addEventListener('beforeunload', ()=>{
  if(watchId) navigator.geolocation.clearWatch(watchId);
  stopEtaCountdown();
});

initMap();
</script>
</body>
</html>
