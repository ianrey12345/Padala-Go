<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Padala Rider">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0C4A45">
<title>Rider Sign In · Padala Go</title>
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
<div class="app-shell">
  <div class="content auth-wrap">
    <div class="brand-mark">
      <div class="dot" style="background:var(--teal); color:#fff;">P</div>
      <span>Padala Go <span style="color:var(--amber);">Rider</span></span>
    </div>

    <h1>Rider sign in</h1>
    <p style="color:#6C7A78; font-size:14px; margin-top:0;">Sign in to see available deliveries.</p>

    <div id="errorBanner" class="error-banner"></div>

    <form id="loginForm" style="margin-top:20px;">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@email.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="link-row" style="margin-top:-8px; margin-bottom:18px; justify-content:flex-end;">
        <a href="../customer/forgot-password.html">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary" id="signInBtn">Sign In</button>
    </form>

    <div class="divider">or</div>

    <a href="signup.html" class="btn btn-outline">Become a rider</a>

    <p style="text-align:center; font-size:12px; color:#9B9186; margin-top:26px;">
      Sending a delivery instead? <a href="../customer/index.html" style="color:var(--teal); font-weight:600;">Sign in as a customer</a>
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script>
const form = document.getElementById('loginForm');
const errorBanner = document.getElementById('errorBanner');
const signInBtn = document.getElementById('signInBtn');

auth.onAuthStateChanged(async user=>{
  if(user){
    await user.reload().catch(()=>{});
    if(!user.emailVerified){
      window.location.href = "verify-email.html";
      return;
    }
    const doc = await db.collection('users').doc(user.uid).get();
    if(doc.exists && doc.data().role === 'rider'){
      window.location.href = doc.data().verificationStatus === 'approved' ? "orders.html" : "pending-review.html";
    }
  }
});

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  errorBanner.style.display = "none";
  signInBtn.disabled = true;
  signInBtn.innerHTML = '<span class="spinner"></span> Signing in…';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try{
    const cred = await auth.signInWithEmailAndPassword(email, password);
    const doc = await db.collection('users').doc(cred.user.uid).get();
    if(!doc.exists || doc.data().role !== 'rider'){
      errorBanner.textContent = "This account isn't registered as a rider. Use \"Become a rider\" to sign up.";
      errorBanner.style.display = "block";
      await auth.signOut();
      signInBtn.disabled = false;
      signInBtn.textContent = "Sign In";
      return;
    }
    if(!cred.user.emailVerified){
      window.location.href = "verify-email.html";
      return;
    }
    window.location.href = doc.data().verificationStatus === 'approved' ? "orders.html" : "pending-review.html";
  } catch(err){
    errorBanner.textContent = friendlyError(err.code);
    errorBanner.style.display = "block";
    signInBtn.disabled = false;
    signInBtn.textContent = "Sign In";
  }
});

function friendlyError(code){
  switch(code){
    case 'auth/invalid-email': return "That email address doesn't look right.";
    case 'auth/user-not-found': return "No account found with that email.";
    case 'auth/wrong-password': return "Incorrect password. Try again.";
    case 'auth/too-many-requests': return "Too many attempts. Please wait a moment and try again.";
    default: return "Couldn't sign in. Please check your details and try again.";
  }
}
</script>
<script src="../shared/ios-install-banner.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(err => {
      console.error('Service worker registration failed:', err);
    });
  });
}
</script>
</body>
</html>
