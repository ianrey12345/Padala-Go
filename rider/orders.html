<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Available Deliveries · Padala Go</title>
<link rel="stylesheet" href="../shared/styles.css">
<style>
  .menu-section{ background:var(--paper); border-radius:14px; overflow:hidden; box-shadow:var(--shadow); margin-bottom:16px; }
  .menu-section-title{
    padding:10px 16px; font-size:11px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.07em; color:#8A8178; background:var(--cream);
  }
  .menu-row{
    display:flex; justify-content:space-between; align-items:center; padding:14px 16px;
    border-bottom:1px solid var(--line); border-left:4px solid transparent;
    cursor:pointer; user-select:none;
  }
  .menu-row:last-child{ border-bottom:none; }
  .menu-row.active{ border-left-color:var(--amber); background:#FFF9EF; }
  .menu-row .row-label{ font-size:14px; color:var(--ink); font-weight:500; }
  .menu-row .row-right{ display:flex; align-items:center; gap:8px; }
  .menu-row .row-count{ color:var(--teal); font-weight:700; font-family:'Space Mono'; font-size:13px; }
  .menu-row .chevron{ color:#C7BFB2; font-size:15px; }
  .location-pill{
    display:inline-flex; align-items:center; gap:5px; background:rgba(255,255,255,0.15);
    color:#fff; font-size:12px; font-weight:600; padding:4px 10px; border-radius:20px; margin-top:4px;
  }
</style>
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="eyebrow">Padala Go Rider</div>
    <h1 id="greeting">Hi there 👋</h1>
    <div class="sub">Available deliveries near you</div>
    <div class="location-pill" id="locationPill" style="display:none;">📍 <span id="locationText">Locating…</span></div>
  </div>

  <div class="content">
    <div id="map" style="margin-bottom:14px;"></div>

    <div class="menu-section" id="categoryFilters">
      <div class="menu-section-title">Categories</div>
      <div class="menu-row active" data-category="all">
        <span class="row-label">All</span>
        <span class="row-right"><span class="row-count" id="count-all">0</span><span class="chevron">›</span></span>
      </div>
      <div class="menu-row" data-category="bike_delivery">
        <span class="row-label">🏍️ Bike Delivery</span>
        <span class="row-right"><span class="row-count" id="count-bike_delivery">0</span><span class="chevron">›</span></span>
      </div>
      <div class="menu-row" data-category="padala_pabili">
        <span class="row-label">🧾 Padala/Pabili</span>
        <span class="row-right"><span class="row-count" id="count-padala_pabili">0</span><span class="chevron">›</span></span>
      </div>
    </div>

    <div class="menu-section" id="zonesSection" style="display:none;">
      <div class="menu-section-title">Zones</div>
      <div id="placeFilters"></div>
    </div>

    <h3 style="font-size:15px; margin-bottom:8px;">Pending Requests</h3>
    <div id="ordersList">
      <div class="empty-state">Loading available orders…</div>
    </div>
  </div>

  <div class="tabbar">
    <a href="orders.html" class="active"><span class="g">🏍️</span>Deliveries</a>
    <a href="current.html"><span class="g">📋</span>Current</a>
    <a href="#" id="logoutLink"><span class="g">🚪</span>Log Out</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script>
let currentUser = null;
let map;
let markers = [];
let allPendingOrders = [];      // raw docs from the latest snapshot
let requestedMap = {};          // orderId -> already requested by me?
let activeCategory = 'all';
let activePlace = 'all';
let riderLocation = null;       // { lat, lng }

function serviceLabel(s){ return s === 'padala_pabili' ? 'Padala / Pabili' : 'Bike Delivery'; }

requireAuth(async user=>{
  currentUser = user;
  const doc = await db.collection('users').doc(user.uid).get();
  if(!doc.exists || doc.data().role !== 'rider'){
    // wrong role for this app — send to rider sign-in
    await auth.signOut();
    window.location.href = "index.html";
    return;
  }
  const firstName = (doc.data().name || "").split(" ")[0];
  document.getElementById('greeting').textContent = firstName ? `Hi, ${firstName} 👋` : "Hi there 👋";

  startRiderLiveLocation();
  listenToPendingOrders();
  watchForRiderConfirmations(user.uid);
});

function initMap(){
  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: 14.6760, lng: 121.0437 }, // Quezon City
    zoom: 12,
    disableDefaultUI: true,
    gestureHandling: 'greedy',
    zoomControl: true,
  });
}

/* Live location for the rider — updates the header pill with a readable
   municipality/city name (e.g. "You're in Oton") using the free Nominatim
   reverse-geocoding service, and keeps riderLocation current for
   nearest-first sorting of the order list. */
function startRiderLiveLocation(){
  if(!navigator.geolocation) return;
  navigator.geolocation.watchPosition(
    pos=>{
      riderLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      if(map) map.setCenter(riderLocation);
      updateLocationPill(riderLocation);
      renderOrdersList();
      broadcastRiderProfileLocation(riderLocation);
    },
    ()=>{ /* silently ignore — falls back to newest-first ordering */ },
    { enableHighAccuracy: true }
  );
}

let lastGeocodedAt = 0;
async function updateLocationPill(point){
  const now = Date.now();
  if(now - lastGeocodedAt < 30000) return; // avoid hammering Nominatim — refresh at most every 30s
  lastGeocodedAt = now;
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${point.lat}&lon=${point.lng}&zoom=14&addressdetails=1`);
    const data = await res.json();
    const a = data.address || {};
    const place = a.city || a.town || a.municipality || a.village || a.county || '';
    if(place){
      document.getElementById('locationText').textContent = `You're in ${place}`;
      document.getElementById('locationPill').style.display = 'inline-flex';
    }
  } catch(e){ /* ignore */ }
}

let lastProfileLocationWriteAt = 0;
function broadcastRiderProfileLocation(pos){
  // Throttled so a rider just browsing pending orders doesn't hammer Firestore.
  // Lets customers see an ETA for each rider who's requested, before confirming.
  const now = Date.now();
  if(now - lastProfileLocationWriteAt < 8000) return;
  lastProfileLocationWriteAt = now;
  db.collection('users').doc(currentUser.uid).update({
    liveLocation: pos,
    liveLocationUpdatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(()=>{ /* ignore transient failures */ });
}

function clearMarkers(){
  markers.forEach(m=>m.setMap(null));
  markers = [];
}

let isFirstOrdersSnapshot = true;

function listenToPendingOrders(){
  db.collection('orders')
    .where('status','==','pending')
    .orderBy('createdAt','desc')
    .onSnapshot(async snap=>{
      // Alert on new incoming orders — but not for the batch that's already
      // pending the moment the rider opens the app, only ones that arrive
      // while they're online and watching this screen.
      if(!isFirstOrdersSnapshot){
        const newOnes = snap.docChanges().filter(c => c.type === 'added');
        if(newOnes.length > 0){
          playRingtone();
          const msg = newOnes.length === 1
            ? '🔔 New delivery request available!'
            : `🔔 ${newOnes.length} new delivery requests available!`;
          showToast(msg);
          showBrowserNotification('New Delivery Available', 'A new order just came in — open the app to view it.');
        }
      }
      isFirstOrdersSnapshot = false;

      allPendingOrders = snap.docs;
      requestedMap = {};
      await Promise.all(snap.docs.map(async doc=>{
        const reqDoc = await doc.ref.collection('requests').doc(currentUser.uid).get();
        requestedMap[doc.id] = reqDoc.exists && reqDoc.data().status !== 'declined';
      }));
      renderPlaceFilters();
      updateCategoryCounts();
      renderOrdersList();
    });
}

function renderPlaceFilters(){
  const counts = {};
  allPendingOrders.forEach(doc=>{
    const m = doc.data().pickup && doc.data().pickup.municipality;
    if(m) counts[m] = (counts[m] || 0) + 1;
  });

  const zonesSection = document.getElementById('zonesSection');
  const container = document.getElementById('placeFilters');
  const places = Object.keys(counts);

  if(places.length === 0){
    zonesSection.style.display = 'none';
    container.innerHTML = '';
    return;
  }
  zonesSection.style.display = 'block';

  const rows = [`
    <div class="menu-row ${activePlace==='all' ? 'active' : ''}" data-place="all">
      <span class="row-label">📍 All Places</span>
      <span class="row-right"><span class="row-count">${allPendingOrders.length}</span><span class="chevron">›</span></span>
    </div>
  `];
  places.sort().forEach(p=>{
    rows.push(`
      <div class="menu-row ${activePlace===p ? 'active' : ''}" data-place="${p}">
        <span class="row-label">${p}</span>
        <span class="row-right"><span class="row-count">${counts[p]}</span><span class="chevron">›</span></span>
      </div>
    `);
  });
  container.innerHTML = rows.join('');

  container.querySelectorAll('.menu-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      activePlace = row.dataset.place;
      renderPlaceFilters();
      renderOrdersList();
    });
  });
}

function updateCategoryCounts(){
  const counts = { all: allPendingOrders.length, bike_delivery: 0, padala_pabili: 0 };
  allPendingOrders.forEach(doc=>{
    const t = doc.data().serviceType;
    if(counts[t] !== undefined) counts[t]++;
  });
  document.getElementById('count-all').textContent = counts.all;
  document.getElementById('count-bike_delivery').textContent = counts.bike_delivery;
  document.getElementById('count-padala_pabili').textContent = counts.padala_pabili;
}

function renderOrdersList(){
  clearMarkers();
  const list = document.getElementById('ordersList');

  let filtered = allPendingOrders.filter(doc=>{
    const o = doc.data();
    if(activeCategory !== 'all' && o.serviceType !== activeCategory) return false;
    if(activePlace !== 'all' && (!o.pickup || o.pickup.municipality !== activePlace)) return false;
    return true;
  });

  // Nearest-first when we know the rider's live location, otherwise newest-first (already sorted by the query).
  if(riderLocation){
    filtered = filtered.slice().sort((a,b)=>{
      const da = distanceKmBetween(riderLocation, { lat:a.data().pickup.lat, lng:a.data().pickup.lng });
      const db_ = distanceKmBetween(riderLocation, { lat:b.data().pickup.lat, lng:b.data().pickup.lng });
      return da - db_;
    });
  }

  if(filtered.length === 0){
    list.innerHTML = `<div class="empty-state"><div class="glyph">🌤️</div>No pending deliveries match this filter right now.</div>`;
    return;
  }

  list.innerHTML = '';
  filtered.forEach(doc=>{
    const o = doc.data();

    if(map && o.pickup){
      const marker = new google.maps.Marker({
        position: { lat: o.pickup.lat, lng: o.pickup.lng },
        map,
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 8, fillColor: '#0C4A45', fillOpacity: 1,
          strokeColor: '#fff', strokeWeight: 2
        },
        title: o.pickup.address
      });
      markers.push(marker);
    }

    const requested = !!requestedMap[doc.id];
    const distTxt = riderLocation
      ? distanceKmBetween(riderLocation, { lat:o.pickup.lat, lng:o.pickup.lng }).toFixed(1) + ' km away'
      : (o.distanceKm + ' km trip');

    const card = document.createElement('div');
    card.className = 'order-card';
    card.style.cursor = 'pointer';
    card.innerHTML = `
      <div class="top-row">
        <span class="service-tag">${serviceLabel(o.serviceType)}</span>
        <span class="fare-tag">${fmtPeso(o.fare)}</span>
      </div>
      <div class="route">📍 ${o.pickup.address}</div>
      <div class="route">🎯 ${o.dropoff.address}</div>
      <div class="route">📏 ${distTxt}</div>
      ${o.notes ? `<div class="notes">"${o.notes}"</div>` : ''}
      <button class="btn ${requested ? 'btn-outline' : 'btn-primary'} btn-sm" style="margin-top:10px;" ${requested ? 'disabled' : ''}>
        ${requested ? 'Requested ✓' : 'Send Request'}
      </button>
    `;
    card.addEventListener('click', ()=>{
      window.location.href = `order-detail.html?id=${doc.id}`;
    });
    const btn = card.querySelector('button');
    if(!requested){
      btn.addEventListener('click', async (e)=>{
        e.stopPropagation();
        btn.disabled = true;
        btn.textContent = 'Sending…';
        const riderDoc = await db.collection('users').doc(currentUser.uid).get();
        await doc.ref.collection('requests').doc(currentUser.uid).set({
          riderId: currentUser.uid,
          riderName: riderDoc.data().name,
          status: 'pending',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        requestedMap[doc.id] = true;
        btn.textContent = 'Requested ✓';
        btn.className = 'btn btn-outline btn-sm';
      });
    }
    list.appendChild(card);
  });
}

document.getElementById('categoryFilters').querySelectorAll('.menu-row').forEach(row=>{
  row.addEventListener('click', ()=>{
    activeCategory = row.dataset.category;
    document.getElementById('categoryFilters').querySelectorAll('.menu-row').forEach(r=>r.classList.remove('active'));
    row.classList.add('active');
    renderOrdersList();
  });
});

document.getElementById('logoutLink').addEventListener('click', async (e)=>{
  e.preventDefault();
  await auth.signOut();
  window.location.href = "index.html";
});
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCJ2QThH1zXt-7U5HlbvSk2f2S33IsrHic&callback=initMap" async defer></script>
</body>
</html>
