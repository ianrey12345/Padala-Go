<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Padala Go">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0C4A45">
<title>Padala Go</title>
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="eyebrow">Padala Go</div>
    <h1 id="greeting">Hi there 👋</h1>
    <div class="sub">Where are we sending today?</div>
  </div>

  <div class="content">
    <div class="service-grid">
      <a class="service-card" href="order.html?service=bike_delivery">
        <div class="icon">🏍️</div>
        <div>
          <h3>Bike Delivery</h3>
          <p>Point-to-point delivery by motorbike</p>
        </div>
      </a>
      <a class="service-card" href="order.html?service=padala_pabili">
        <div class="icon">🧾</div>
        <div>
          <h3>Padala / Pabili</h3>
          <p>Send an item, or have a rider buy something for you</p>
        </div>
      </a>
    </div>

    <div class="hint" style="margin-top:18px; text-align:center;">
      Rate: ₱12 per succeeding kilometer after the first.
    </div>
  </div>

  <div class="tabbar">
    <a href="home.html" class="active"><span class="g">🏠</span>Home</a>
    <a href="chat.html"><span class="g">💬</span>Chat</a>
    <a href="support.html"><span class="g">🎧</span>Support</a>
    <a href="my-orders.html"><span class="g">📦</span>My Orders</a>
    <a href="#" id="logoutLink"><span class="g">🚪</span>Log Out</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script>
requireAuth(async (user)=>{
  watchForNewRequests(user.uid);
  watchForRiderArrival(user.uid);
  watchForOrderCompletion(user.uid);
  try{
    const doc = await db.collection('users').doc(user.uid).get();
    if(doc.exists){
      const firstName = (doc.data().name || "").split(" ")[0];
      document.getElementById('greeting').textContent = firstName ? `Hi, ${firstName} 👋` : "Hi there 👋";
    }
  }catch(e){}
});

document.getElementById('logoutLink').addEventListener('click', async (e)=>{
  e.preventDefault();
  await auth.signOut();
  window.location.href = "index.html";
});
</script>
<script src="../shared/ios-install-banner.js"></script>

<!-- Screen wake lock: keeps the screen from dimming while the app is open.
     This is currently the DEBUG version of wake-lock.js — it shows its
     own live status banner at the bottom of the screen. Swap in the
     plain version once this is confirmed working. -->
<script src="https://cdn.jsdelivr.net/npm/nosleep.js@0.12.0/dist/NoSleep.min.js"></script>
<script src="../shared/wake-lock.js"></script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(err => {
      console.error('Service worker registration failed:', err);
    });
  });
}
</script>
</body>
</html>
