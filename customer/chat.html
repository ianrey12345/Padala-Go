<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Padala Go">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0C4A45">
<title>Chat · Padala Go</title>
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="eyebrow">Padala Go</div>
    <h1>Chat</h1>
    <div class="sub">Message your rider once they've accepted your delivery</div>
  </div>

  <div class="content" id="chatList">
    <div class="empty-state">Loading…</div>
  </div>

  <div class="tabbar">
    <a href="home.html"><span class="g">🏠</span>Home</a>
    <a href="chat.html" class="active"><span class="g">💬</span>Chat</a>
    <a href="my-orders.html"><span class="g">📦</span>My Orders</a>
    <a href="#" id="logoutLink"><span class="g">🚪</span>Log Out</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script>
function serviceLabel(s){ return s === 'padala_pabili' ? 'Padala / Pabili' : 'Bike Delivery'; }

requireAuth(user=>{
  watchForNewRequests(user.uid);
  watchForRiderArrival(user.uid);
  watchForOrderCompletion(user.uid);
  // Chat threads only exist for orders where a rider has actually been
  // confirmed — that's what "the booking is approved" means here.
  db.collection('orders')
    .where('customerId','==', user.uid)
    .where('status','in', ['confirmed','in_progress','completed'])
    .orderBy('createdAt','desc')
    .onSnapshot(async snap=>{
      const container = document.getElementById('chatList');
      if(snap.empty){
        container.innerHTML = `<div class="empty-state"><div class="glyph">💬</div>Chat unlocks once a rider accepts your delivery.</div>`;
        return;
      }
      container.innerHTML = '';
      for(const doc of snap.docs){
        const o = doc.data();
        let riderName = 'Rider';
        try{
          const riderDoc = await db.collection('users').doc(o.riderId).get();
          if(riderDoc.exists) riderName = riderDoc.data().name || 'Rider';
        } catch(e){ /* fall back to default label */ }

        const card = document.createElement('a');
        card.href = `chat-thread.html?id=${doc.id}`;
        card.style.textDecoration = 'none';
        card.style.color = 'inherit';
        card.innerHTML = `
          <div class="order-card">
            <div class="top-row">
              <span class="service-tag">${serviceLabel(o.serviceType)}</span>
              <span class="status-badge status-${o.status}">${o.status.replace('_',' ')}</span>
            </div>
            <div class="route">🏍️ Chat with ${riderName}</div>
            <div class="route">📍 ${o.pickup.address}</div>
          </div>
        `;
        container.appendChild(card);
      }
    }, err=>{
      document.getElementById('chatList').innerHTML =
        `<div class="empty-state">Couldn't load chats. Check the browser console for a Firestore index link if this is your first time here.</div>`;
    });
});

document.getElementById('logoutLink').addEventListener('click', async (e)=>{
  e.preventDefault();
  await auth.signOut();
  window.location.href = "index.html";
});
</script>
<script src="../shared/ios-install-banner.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(err => {
      console.error('Service worker registration failed:', err);
    });
  });
}
</script>
</body>
</html>
