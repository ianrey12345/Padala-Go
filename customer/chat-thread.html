<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Padala Go">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0C4A45">
<title>Chat · Padala Go</title>
<link rel="stylesheet" href="../shared/styles.css">
<style>
  html, body{ height:100%; }
  body{ background:var(--paper); }
  .chat-shell{ display:flex; flex-direction:column; height:100vh; max-width:480px; margin:0 auto; }
  .chat-topbar{ background:var(--teal); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .chat-topbar .back{ color:#fff; text-decoration:none; font-size:20px; }
  .chat-topbar .who{ font-family:'Sora'; font-weight:700; font-size:16px; }
  .chat-topbar .sub{ font-size:11.5px; opacity:0.8; }
  .messages{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .bubble{ max-width:75%; padding:10px 14px; border-radius:16px; font-size:14px; line-height:1.4; word-wrap:break-word; }
  .bubble.mine{ align-self:flex-end; background:var(--teal); color:#fff; border-bottom-right-radius:4px; }
  .bubble.theirs{ align-self:flex-start; background:var(--cream); color:var(--ink); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .bubble .meta{ font-size:10.5px; opacity:0.65; margin-top:4px; }
  .composer{ display:flex; gap:8px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:#fff; flex-shrink:0; }
  .composer input{ flex:1; padding:11px 14px; border-radius:20px; border:1.5px solid var(--line); font-size:14px; font-family:'Inter'; }
  .composer input:focus{ outline:none; border-color:var(--teal); }
  .composer button{ width:42px; height:42px; border-radius:50%; background:var(--teal); color:#fff; border:none; font-size:18px; cursor:pointer; flex-shrink:0; }
  .composer button:disabled{ opacity:0.5; }
</style>
</head>
<body>
<div class="chat-shell">
  <div class="chat-topbar">
    <a href="chat.html" class="back" id="backLink">←</a>
    <div>
      <div class="who" id="riderNameHeader">Rider</div>
      <div class="sub" id="riderVehicleHeader"></div>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="empty-state">Loading…</div>
  </div>

  <form class="composer" id="composerForm">
    <input type="text" id="messageInput" placeholder="Type a message…" autocomplete="off" required>
    <button type="submit" id="sendBtn">➤</button>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const orderId = params.get('id');
let currentUser = null;
let customerName = 'You';

requireAuth(async user=>{
  currentUser = user;
  if(!orderId){ window.location.href = "chat.html"; return; }

  const [orderDoc, myDoc] = await Promise.all([
    db.collection('orders').doc(orderId).get(),
    db.collection('users').doc(user.uid).get()
  ]);

  // Only the customer who placed this order, and only once a rider has
  // actually been confirmed on it, gets to open this thread.
  if(!orderDoc.exists || orderDoc.data().customerId !== user.uid || !orderDoc.data().riderId){
    window.location.href = "chat.html";
    return;
  }
  customerName = myDoc.exists ? (myDoc.data().name || 'You') : 'You';

  const o = orderDoc.data();
  try{
    const riderDoc = await db.collection('users').doc(o.riderId).get();
    if(riderDoc.exists){
      const r = riderDoc.data();
      document.getElementById('riderNameHeader').textContent = r.name || 'Rider';
      const bits = [];
      if(r.motorColor) bits.push(r.motorColor);
      if(r.plate) bits.push(`Plate ${r.plate}`);
      document.getElementById('riderVehicleHeader').textContent = bits.join(' · ');
    }
  } catch(e){ /* keep default header */ }

  listenToMessages();
});

function listenToMessages(){
  db.collection('orders').doc(orderId).collection('messages')
    .orderBy('createdAt','asc')
    .onSnapshot(snap=>{
      const container = document.getElementById('messages');
      if(snap.empty){
        container.innerHTML = `<div class="empty-state"><div class="glyph">💬</div>Say hi to your rider!</div>`;
        return;
      }
      container.innerHTML = '';
      snap.forEach(doc=>{
        const m = doc.data();
        const mine = m.senderId === currentUser.uid;
        const bubble = document.createElement('div');
        bubble.className = `bubble ${mine ? 'mine' : 'theirs'}`;
        bubble.innerHTML = `
          ${escapeHtml(m.text)}
          <div class="meta">${m.createdAt ? timeAgo(m.createdAt) : 'sending…'}</div>
        `;
        container.appendChild(bubble);
      });
      container.scrollTop = container.scrollHeight;
    }, err=>{
      document.getElementById('messages').innerHTML = `<div class="empty-state">Couldn't load messages.</div>`;
    });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// If we arrived here from an in-app page (e.g. the "Chat with Rider"
// button on order-status.html), go back to it. Only fall back to the
// generic chat.html link when there's nowhere in history to return to
// (e.g. this page was opened directly / from a bookmark).
document.getElementById('backLink').addEventListener('click', function(e){
  if(window.history.length > 1){
    e.preventDefault();
    window.history.back();
  }
});

document.getElementById('composerForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if(!text) return;
  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;
  input.value = '';
  try{
    await db.collection('orders').doc(orderId).collection('messages').add({
      senderId: currentUser.uid,
      senderRole: 'customer',
      senderName: customerName,
      text,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch(err){
    input.value = text; // restore the draft so nothing gets lost on failure
  }
  sendBtn.disabled = false;
  input.focus();
});
</script>
<script src="../shared/ios-install-banner.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(err => {
      console.error('Service worker registration failed:', err);
    });
  });
}
</script>
</body>
</html>
