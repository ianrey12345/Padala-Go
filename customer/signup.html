<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Padala Go">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0C4A45">
<title>Create Account · Padala Go</title>
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
<div class="app-shell">
  <div class="content auth-wrap">
    <div class="brand-mark">
      <div class="dot">P</div>
      <span>Padala Go</span>
    </div>

    <h1>Create your account</h1>
    <p style="color:#6C7A78; font-size:14px; margin-top:0;">Send bikes, padala, or pabili in a few taps.</p>

    <div id="errorBanner" class="error-banner"></div>

    <form id="signupForm" style="margin-top:20px;">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="Juan Dela Cruz" required>
      </div>
      <div class="field">
        <label for="phone">Mobile number</label>
        <input type="tel" id="phone" placeholder="09XX XXX XXXX" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@email.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" minlength="6" required>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter your password" minlength="6" required>
      </div>

      <button type="submit" class="btn btn-primary" id="signUpBtn">Sign Up</button>
    </form>

    <p style="text-align:center; font-size:13.5px; color:#6C7A78; margin-top:18px;">
      Already have an account? <a href="index.html" style="color:var(--teal); font-weight:600;">Sign in</a>
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script>
const form = document.getElementById('signupForm');
const errorBanner = document.getElementById('errorBanner');
const signUpBtn = document.getElementById('signUpBtn');

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  errorBanner.style.display = "none";

  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  // Checked before anything touches Firebase — no point creating an
  // account (or even attempting to) if the two password fields don't
  // agree with each other.
  if(password !== confirmPassword){
    errorBanner.textContent = "Passwords don't match. Please re-enter them.";
    errorBanner.style.display = "block";
    return;
  }

  signUpBtn.disabled = true;
  signUpBtn.innerHTML = '<span class="spinner"></span> Creating account…';

  try{
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    await db.collection('users').doc(cred.user.uid).set({
      name, phone, email,
      role: 'customer',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await cred.user.sendEmailVerification().catch(()=>{});
    window.location.href = "verify-email.html";
  } catch(err){
    errorBanner.textContent = friendlyError(err.code);
    errorBanner.style.display = "block";
    signUpBtn.disabled = false;
    signUpBtn.textContent = "Sign Up";
  }
});

function friendlyError(code){
  switch(code){
    case 'auth/email-already-in-use': return "That email is already registered. Try signing in instead.";
    case 'auth/invalid-email': return "That email address doesn't look right.";
    case 'auth/weak-password': return "Password should be at least 6 characters.";
    default: return "Couldn't create your account. Please check your details and try again.";
  }
}
</script>
<script src="../shared/ios-install-banner.js"></script>
<script src="../shared/password-toggle.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(err => {
      console.error('Service worker registration failed:', err);
    });
  });
}
</script>
</body>
</html>
