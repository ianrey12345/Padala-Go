<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Padala Go">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0C4A45">
<title>Create Account · Padala Go</title>
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
<div class="app-shell">
  <div class="content auth-wrap">
    <div class="brand-mark">
      <div class="dot">P</div>
      <span>Padala Go</span>
    </div>

    <h1>Create your account</h1>
    <p style="color:#6C7A78; font-size:14px; margin-top:0;">Send bikes, padala, or pabili in a few taps.</p>

    <div id="errorBanner" class="error-banner"></div>

    <form id="signupForm" style="margin-top:20px;">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="Juan Dela Cruz" required>
      </div>
      <div class="field">
        <label for="phone">Mobile number</label>
        <input type="tel" id="phone" placeholder="09XX XXX XXXX" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@email.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" minlength="6" required>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter your password" minlength="6" required>
      </div>

      <div style="display:flex; align-items:flex-start; gap:10px; margin:18px 0 6px;">
        <input type="checkbox" id="agreeTerms" required style="margin-top:3px; width:16px; height:16px; flex-shrink:0; accent-color:var(--teal);">
        <label for="agreeTerms" style="font-size:12.5px; color:#6C7A78; font-weight:400; line-height:1.4;">
          By checking this box, I agree to the <a href="terms.html" target="_blank" style="color:var(--teal); font-weight:600;">Terms of Service</a> and <a href="privacy.html" target="_blank" style="color:var(--teal); font-weight:600;">Privacy Policy</a>, and consent to the processing of my personal information as described therein.
        </label>
      </div>

      <button type="submit" class="btn btn-primary" id="signUpBtn" disabled>Sign Up</button>
    </form>

    <p style="text-align:center; font-size:13.5px; color:#6C7A78; margin-top:18px;">
      Already have an account? <a href="index.html" style="color:var(--teal); font-weight:600;">Sign in</a>
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script>
const form = document.getElementById('signupForm');
const errorBanner = document.getElementById('errorBanner');
const signUpBtn = document.getElementById('signUpBtn');
const agreeTermsCheckbox = document.getElementById('agreeTerms');

// Sign Up stays disabled until the box is checked — this listener keeps
// that current even if the person checks/unchecks it a few times before
// submitting.
agreeTermsCheckbox.addEventListener('change', ()=>{
  signUpBtn.disabled = !agreeTermsCheckbox.checked;
  saveDraft();
});

/* ---------------------------------------------------------
   Draft persistence — the Terms/Privacy links below open with
   target="_blank", which behaves like a real new tab in a normal
   browser (this tab is untouched). But in a home-screen-installed PWA
   there are no real tabs, so it navigates away in place, and coming
   "back" is a full reload of this page — wiping out anything already
   typed. sessionStorage survives that reload (it only clears when the
   tab/app is fully closed), so every keystroke is mirrored there and
   restored on load.
   Passwords are deliberately NOT saved here — re-typing a password
   after checking a policy page is a small price for not leaving even a
   session-scoped copy of it sitting in storage.
   --------------------------------------------------------- */
const DRAFT_KEY = 'padalaSignupDraft_customer';
const DRAFT_FIELD_IDS = ['name', 'phone', 'email'];

function saveDraft(){
  const draft = {};
  DRAFT_FIELD_IDS.forEach(id=>{ draft[id] = document.getElementById(id).value; });
  draft.agreeTerms = agreeTermsCheckbox.checked;
  try{ sessionStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); } catch(e){ /* storage unavailable — draft just won't persist */ }
}

function restoreDraft(){
  let draft;
  try{
    const raw = sessionStorage.getItem(DRAFT_KEY);
    if(!raw) return;
    draft = JSON.parse(raw);
  } catch(e){ return; }

  DRAFT_FIELD_IDS.forEach(id=>{
    if(draft[id]) document.getElementById(id).value = draft[id];
  });
  if(draft.agreeTerms){
    agreeTermsCheckbox.checked = true;
    signUpBtn.disabled = false;
  }
}

function clearDraft(){
  try{ sessionStorage.removeItem(DRAFT_KEY); } catch(e){}
}

restoreDraft();
DRAFT_FIELD_IDS.forEach(id=>{
  document.getElementById(id).addEventListener('input', saveDraft);
});

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  errorBanner.style.display = "none";

  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  // Belt-and-suspenders check — the button is already disabled without
  // this, but the checkbox has `required` too in case JS ever fails to
  // load for some reason.
  if(!agreeTermsCheckbox.checked){
    errorBanner.textContent = "Please agree to the Terms of Service and Privacy Policy to continue.";
    errorBanner.style.display = "block";
    return;
  }

  if(password !== confirmPassword){
    errorBanner.textContent = "Passwords don't match. Please re-enter them.";
    errorBanner.style.display = "block";
    return;
  }

  signUpBtn.disabled = true;
  signUpBtn.innerHTML = '<span class="spinner"></span> Creating account…';

  try{
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    await db.collection('users').doc(cred.user.uid).set({
      name, phone, email,
      role: 'customer',
      agreedToTermsAt: firebase.firestore.FieldValue.serverTimestamp(),
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await cred.user.sendEmailVerification().catch(()=>{});
    clearDraft();
    window.location.href = "verify-email.html";
  } catch(err){
    errorBanner.textContent = friendlyError(err.code);
    errorBanner.style.display = "block";
    signUpBtn.disabled = false;
    signUpBtn.textContent = "Sign Up";
  }
});

function friendlyError(code){
  switch(code){
    case 'auth/email-already-in-use': return "That email is already registered. Try signing in instead.";
    case 'auth/invalid-email': return "That email address doesn't look right.";
    case 'auth/weak-password': return "Password should be at least 6 characters.";
    default: return "Couldn't create your account. Please check your details and try again.";
  }
}
</script>
<script src="../shared/ios-install-banner.js"></script>
<script src="../shared/password-toggle.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(err => {
      console.error('Service worker registration failed:', err);
    });
  });
}
</script>
</body>
</html>
