<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders · Padala Go</title>
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="eyebrow">Padala Go</div>
    <h1>My Orders</h1>
  </div>

  <div class="content" id="ordersList">
    <div class="empty-state">Loading…</div>
  </div>

  <div class="tabbar">
    <a href="home.html"><span class="g">🏠</span>Home</a>
    <a href="my-orders.html" class="active"><span class="g">📦</span>My Orders</a>
    <a href="#" id="logoutLink"><span class="g">🚪</span>Log Out</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script>
function serviceLabel(s){ return s === 'padala_pabili' ? 'Padala / Pabili' : 'Bike Delivery'; }

requireAuth(user=>{
  db.collection('orders')
    .where('customerId','==', user.uid)
    .orderBy('createdAt','desc')
    .onSnapshot(snap=>{
      const container = document.getElementById('ordersList');
      if(snap.empty){
        container.innerHTML = `<div class="empty-state"><div class="glyph">📦</div>No orders yet. Head to Home to send your first delivery.</div>`;
        return;
      }
      container.innerHTML = '';
      snap.forEach(doc=>{
        const o = doc.data();
        const card = document.createElement('a');
        card.href = `order-status.html?id=${doc.id}`;
        card.style.textDecoration = 'none';
        card.style.color = 'inherit';
        card.innerHTML = `
          <div class="order-card">
            <div class="top-row">
              <span class="service-tag">${serviceLabel(o.serviceType)}</span>
              <span class="fare-tag">${fmtPeso(o.fare)}</span>
            </div>
            <div class="route">📍 ${o.pickup.address}</div>
            <div class="route">🎯 ${o.dropoff.address}</div>
            <span class="status-badge status-${o.status}">${o.status.replace('_',' ')}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }, err=>{
      document.getElementById('ordersList').innerHTML =
        `<div class="empty-state">Couldn't load orders. If this is your first order, Firestore may need an index — check the browser console for a link to create it.</div>`;
    });
});

document.getElementById('logoutLink').addEventListener('click', async (e)=>{
  e.preventDefault();
  await auth.signOut();
  window.location.href = "index.html";
});
</script>
</body>
</html>
