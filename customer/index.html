<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In · Padala Go</title>
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
<div class="app-shell">
  <div class="content auth-wrap">
    <div class="brand-mark">
      <div class="dot">P</div>
      <span>Padala Go</span>
    </div>

    <h1>Welcome back</h1>
    <p style="color:#6C7A78; font-size:14px; margin-top:0;">Sign in to send a delivery.</p>

    <div id="errorBanner" class="error-banner"></div>

    <form id="loginForm" style="margin-top:20px;">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@email.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="link-row" style="margin-top:-8px; margin-bottom:18px; justify-content:flex-end;">
        <a href="forgot-password.html">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary" id="signInBtn">Sign In</button>
    </form>

    <div class="divider">or</div>

    <a href="signup.html" class="btn btn-outline">Create an account</a>

    <p style="text-align:center; font-size:12px; color:#9B9186; margin-top:26px;">
      Delivery rider? <a href="../rider/index.html" style="color:var(--teal); font-weight:600;">Sign in as a rider</a>
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script>
const form = document.getElementById('loginForm');
const errorBanner = document.getElementById('errorBanner');
const signInBtn = document.getElementById('signInBtn');

// If already signed in, skip straight to home
auth.onAuthStateChanged(user=>{
  if(user) window.location.href = "home.html";
});

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  errorBanner.style.display = "none";
  signInBtn.disabled = true;
  signInBtn.innerHTML = '<span class="spinner"></span> Signing in…';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try{
    await auth.signInWithEmailAndPassword(email, password);
    window.location.href = "home.html";
  } catch(err){
    errorBanner.textContent = friendlyError(err.code);
    errorBanner.style.display = "block";
    signInBtn.disabled = false;
    signInBtn.textContent = "Sign In";
  }
});

function friendlyError(code){
  switch(code){
    case 'auth/invalid-email': return "That email address doesn't look right.";
    case 'auth/user-not-found': return "No account found with that email.";
    case 'auth/wrong-password': return "Incorrect password. Try again.";
    case 'auth/too-many-requests': return "Too many attempts. Please wait a moment and try again.";
    default: return "Couldn't sign in. Please check your details and try again.";
  }
}
</script>
</body>
</html>
