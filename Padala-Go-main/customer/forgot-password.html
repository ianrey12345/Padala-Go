<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password · Padala Go</title>
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
<div class="app-shell">
  <div class="content auth-wrap">
    <div class="brand-mark">
      <div class="dot">P</div>
      <span>Padala Go</span>
    </div>

    <h1>Reset your password</h1>
    <p style="color:#6C7A78; font-size:14px; margin-top:0;">We'll email you a link to set a new one.</p>

    <div id="errorBanner" class="error-banner"></div>
    <div id="successBanner" class="success-banner"></div>

    <form id="resetForm" style="margin-top:20px;">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@email.com" required>
      </div>
      <button type="submit" class="btn btn-primary" id="resetBtn">Send Reset Link</button>
    </form>

    <p style="text-align:center; font-size:13.5px; color:#6C7A78; margin-top:18px;">
      <a href="index.html" style="color:var(--teal); font-weight:600;">Back to Sign In</a>
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script>
const form = document.getElementById('resetForm');
const errorBanner = document.getElementById('errorBanner');
const successBanner = document.getElementById('successBanner');
const resetBtn = document.getElementById('resetBtn');

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  errorBanner.style.display = "none";
  successBanner.style.display = "none";
  resetBtn.disabled = true;
  resetBtn.innerHTML = '<span class="spinner"></span> Sending…';

  const email = document.getElementById('email').value.trim();

  try{
    await auth.sendPasswordResetEmail(email);
    successBanner.textContent = "Reset link sent — check your inbox.";
    successBanner.style.display = "block";
    form.reset();
  } catch(err){
    errorBanner.textContent = "Couldn't send the reset link. Double-check the email address.";
    errorBanner.style.display = "block";
  }
  resetBtn.disabled = false;
  resetBtn.textContent = "Send Reset Link";
});
</script>
</body>
</html>
