<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Sign In · Padala Go</title>
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
<div class="app-shell">
  <div class="content auth-wrap">
    <div class="brand-mark">
      <div class="dot" style="background:var(--teal-dark); color:#fff;">P</div>
      <span>Padala Go <span style="color:var(--amber);">Admin</span></span>
    </div>

    <h1>Admin sign in</h1>
    <p style="color:#6C7A78; font-size:14px; margin-top:0;">Review and approve rider wallet refill requests.</p>

    <div id="errorBanner" class="error-banner"></div>

    <form id="loginForm" style="margin-top:20px;">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="admin@email.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" id="signInBtn">Sign In</button>
    </form>

    <p style="text-align:center; font-size:12px; color:#9B9186; margin-top:26px;">
      An account needs <code>role: "admin"</code> set on its Firestore user doc to sign in here — see the README.
    </p>

    <!-- Visible debug panel — safe to delete once login is working. Mirrors
         whatever's happening to the console, so you don't need DevTools open
         on a phone/tablet to see what's going wrong. -->
    <div id="debugPanel" style="display:none; margin-top:20px; padding:12px 14px; background:#F5F0E6; border:1px solid var(--line); border-radius:12px; font-family:'Space Mono'; font-size:11px; color:#586866; white-space:pre-wrap; word-break:break-word;"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script>
const form = document.getElementById('loginForm');
const errorBanner = document.getElementById('errorBanner');
const signInBtn = document.getElementById('signInBtn');
const debugPanel = document.getElementById('debugPanel');

function debugLog(label, data){
  console.log(`[admin-login] ${label}`, data);
  debugPanel.style.display = 'block';
  const line = `${label}: ${typeof data === 'object' ? JSON.stringify(data) : data}`;
  debugPanel.textContent += (debugPanel.textContent ? '\n' : '') + line;
}

function showError(msg){
  errorBanner.textContent = msg;
  errorBanner.style.display = "block";
}

// If already signed in AND already confirmed admin, skip straight to Requests.
// Deliberately does NOT auto-sign-out here on its own — that only happens
// inside the explicit checks below, each with a logged reason, so a bounce
// back to this page always comes with an explanation in the debug panel.
auth.onAuthStateChanged(async user=>{
  if(!user) return;
  debugLog('onAuthStateChanged: signed in as', user.uid);
  try{
    const doc = await db.collection('users').doc(user.uid).get();
    debugLog('users/' + user.uid + ' exists?', doc.exists);
    if(doc.exists){
      debugLog('role field', doc.data().role);
    }
    if(doc.exists && doc.data().role === 'admin'){
      window.location.href = "requests.html";
    }
  } catch(err){
    debugLog('Firestore read error (onAuthStateChanged)', `${err.code || 'unknown'} — ${err.message}`);
  }
});

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  errorBanner.style.display = "none";
  debugPanel.textContent = '';
  debugPanel.style.display = 'none';
  signInBtn.disabled = true;
  signInBtn.innerHTML = '<span class="spinner"></span> Signing in…';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try{
    const cred = await auth.signInWithEmailAndPassword(email, password);
    debugLog('Auth sign-in succeeded, uid', cred.user.uid);

    let doc;
    try{
      doc = await db.collection('users').doc(cred.user.uid).get();
    } catch(firestoreErr){
      // This is the case that used to fail silently — a Firestore rules /
      // network error on the read gets caught separately from "not an
      // admin", so it shows its real cause instead of a generic bounce.
      debugLog('Firestore read FAILED', `${firestoreErr.code || 'unknown'} — ${firestoreErr.message}`);
      showError(`Couldn't verify admin status: ${firestoreErr.code || firestoreErr.message}. This is usually a Firestore security rules issue — check that authenticated users are allowed to read their own users/{uid} doc.`);
      await auth.signOut();
      signInBtn.disabled = false;
      signInBtn.textContent = "Sign In";
      return;
    }

    debugLog('users/' + cred.user.uid + ' exists?', doc.exists);
    if(doc.exists){
      debugLog('Full user doc', doc.data());
    }

    if(!doc.exists){
      showError("Signed in, but no matching Firestore user document was found at users/" + cred.user.uid + ". Create one with a role field set to \"admin\".");
      await auth.signOut();
      signInBtn.disabled = false;
      signInBtn.textContent = "Sign In";
      return;
    }
    if(doc.data().role !== 'admin'){
      showError(`Signed in, but this account's role is "${doc.data().role || '(not set)'}", not "admin". Edit the role field on users/${cred.user.uid} in Firestore.`);
      await auth.signOut();
      signInBtn.disabled = false;
      signInBtn.textContent = "Sign In";
      return;
    }

    debugLog('Role check passed — redirecting to', 'requests.html');
    window.location.href = "requests.html";
  } catch(err){
    debugLog('Auth sign-in FAILED', `${err.code || 'unknown'} — ${err.message}`);
    showError(friendlyError(err.code));
    signInBtn.disabled = false;
    signInBtn.textContent = "Sign In";
  }
});

function friendlyError(code){
  switch(code){
    case 'auth/invalid-email': return "That email address doesn't look right.";
    case 'auth/user-not-found': return "No account found with that email.";
    case 'auth/wrong-password': return "Incorrect password. Try again.";
    case 'auth/invalid-credential': return "Incorrect email or password.";
    case 'auth/too-many-requests': return "Too many attempts. Please wait a moment and try again.";
    default: return `Couldn't sign in (${code || 'unknown error'}). See the debug panel below for details.`;
  }
}
</script>
</body>
</html>
