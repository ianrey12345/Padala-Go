<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Refill Requests · Padala Go Admin</title>
<link rel="stylesheet" href="../shared/styles.css">
<style>
  .request-row{
    background:var(--paper); border-radius:14px; padding:16px; margin-bottom:12px;
    box-shadow:var(--shadow); border:1.5px solid var(--line);
  }
  .request-row .top-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .request-row .amount{ font-family:'Space Mono'; font-weight:700; font-size:20px; color:var(--teal-dark); }
  .request-row .rider{ font-size:14px; font-weight:600; }
  .request-row .when{ font-size:12px; color:#8A8178; margin-top:2px; }
  .request-actions{ display:flex; gap:10px; margin-top:12px; }
  .btn-reject{ background:transparent; color:var(--red); border:1.5px solid var(--red); }
  .btn-approve{ background:var(--green); color:#fff; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="eyebrow">Padala Go Admin</div>
    <h1>Refill Requests</h1>
    <div class="sub">Approve or reject rider wallet top-ups</div>
  </div>

  <div class="content">
    <div class="filter-row" style="display:flex; gap:8px; margin-bottom:14px;">
      <div class="amount-chip active" data-filter="pending" style="flex:1;">Pending</div>
      <div class="amount-chip" data-filter="approved" style="flex:1;">Approved</div>
      <div class="amount-chip" data-filter="rejected" style="flex:1;">Rejected</div>
    </div>
    <div id="requestsList">
      <div class="empty-state">Loading requests…</div>
    </div>
  </div>

  <div class="tabbar">
    <a href="requests.html" class="active"><span class="g">💰</span>Requests</a>
    <a href="#" id="logoutLink"><span class="g">🚪</span>Log Out</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script>
let currentAdmin = null;
let activeFilter = 'pending';
let unsub = null;

requireAdminAuth((user)=>{
  currentAdmin = user;
  listenToRequests();
});

document.querySelectorAll('[data-filter]').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    document.querySelectorAll('[data-filter]').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = chip.dataset.filter;
    listenToRequests();
  });
});

function listenToRequests(){
  if(unsub) unsub();
  const list = document.getElementById('requestsList');
  list.innerHTML = `<div class="empty-state">Loading requests…</div>`;

  unsub = db.collection('refillRequests')
    .where('status','==', activeFilter)
    .orderBy('createdAt','desc')
    .onSnapshot(snap=>{
      if(snap.empty){
        list.innerHTML = `<div class="empty-state"><div class="glyph">📭</div>No ${activeFilter} requests.</div>`;
        return;
      }
      list.innerHTML = '';
      snap.forEach(doc=>{
        const r = doc.data();
        const row = document.createElement('div');
        row.className = 'request-row';
        row.innerHTML = `
          <div class="top-row">
            <div>
              <div class="rider">${r.riderName || 'Rider'}</div>
              <div class="when">${r.createdAt ? timeAgo(r.createdAt) : ''}</div>
            </div>
            <div class="amount">${fmtPeso(r.amount)}</div>
          </div>
          ${activeFilter === 'pending' ? `
            <div class="request-actions">
              <button class="btn btn-reject btn-sm" style="flex:1;" data-action="reject">Reject</button>
              <button class="btn btn-approve btn-sm" style="flex:1;" data-action="approve">Approve</button>
            </div>
          ` : `<div class="when">Reviewed ${r.reviewedAt ? timeAgo(r.reviewedAt) : ''}</div>`}
        `;

        if(activeFilter === 'pending'){
          row.querySelector('[data-action="approve"]').addEventListener('click', async (e)=>{
            const btns = row.querySelectorAll('button');
            btns.forEach(b=>b.disabled = true);
            e.target.textContent = 'Approving…';
            try{
              await approveRefillRequest(doc.id, currentAdmin.uid);
            } catch(err){
              alert(err.message || "Couldn't approve this request.");
              btns.forEach(b=>b.disabled = false);
              e.target.textContent = 'Approve';
            }
          });
          row.querySelector('[data-action="reject"]').addEventListener('click', async (e)=>{
            const btns = row.querySelectorAll('button');
            btns.forEach(b=>b.disabled = true);
            e.target.textContent = 'Rejecting…';
            try{
              await rejectRefillRequest(doc.id, currentAdmin.uid);
            } catch(err){
              alert(err.message || "Couldn't reject this request.");
              btns.forEach(b=>b.disabled = false);
              e.target.textContent = 'Reject';
            }
          });
        }

        list.appendChild(row);
      });
    }, err=>{
      list.innerHTML = `<div class="empty-state">Couldn't load requests. Check the browser console for a Firestore index link if this is your first time here.</div>`;
    });
}

document.getElementById('logoutLink').addEventListener('click', async (e)=>{
  e.preventDefault();
  await auth.signOut();
  window.location.href = "index.html";
});
</script>
</body>
</html>
