<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Refill Requests · Padala Go Admin</title>
<link rel="stylesheet" href="../shared/styles.css">
<style>
  .topbar-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .topbar-links{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex-shrink:0; }
  .logout-link{ color:#fff; opacity:0.85; text-decoration:none; font-size:13px; font-weight:600; white-space:nowrap; }

  .filter-tabs{
    display:flex; gap:6px; margin-bottom:16px; background:var(--paper); border-radius:14px;
    padding:5px; box-shadow:var(--shadow);
  }
  .filter-tab{
    flex:1; text-align:center; padding:9px 4px; border-radius:10px; font-size:12.5px; font-weight:700;
    color:#8A8178; cursor:pointer; user-select:none; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .filter-tab.active{ background:var(--teal); color:#fff; }
  .filter-tab .count{
    font-family:'Space Mono'; font-size:11px; background:rgba(0,0,0,0.08); padding:1px 6px; border-radius:10px;
  }
  .filter-tab.active .count{ background:rgba(255,255,255,0.25); }

  .request-card{
    background:var(--paper); border-radius:14px; padding:16px; margin-bottom:12px;
    box-shadow:var(--shadow); border:1.5px solid var(--line);
  }
  .request-card .top-row{ display:flex; justify-content:space-between; align-items:flex-start; }
  .request-card .rider{ font-size:14.5px; font-weight:700; color:var(--teal-dark); }
  .request-card .when{ font-size:11.5px; color:#8A8178; margin-top:2px; }
  .request-card .amount{ font-family:'Space Mono'; font-weight:700; font-size:18px; color:var(--teal-dark); }
  .gcash-details{
    margin-top:10px; padding:10px 12px; background:var(--cream); border-radius:10px;
    font-size:13px; color:var(--ink); display:flex; flex-direction:column; gap:3px;
  }
  .gcash-details .lbl{ font-weight:700; color:#8A8178; margin-right:5px; }
  .request-actions{ display:flex; gap:10px; margin-top:12px; }
  .btn-approve{ background:var(--green); color:#fff; }
  .btn-approve:hover{ background:#25774A; }
  .btn-reject{ background:transparent; color:var(--red); border:1.5px solid var(--red); }
  .btn-reject:hover{ background:#FCEBEB; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="topbar-row">
      <div>
        <div class="eyebrow">Padala Go Admin</div>
        <h1>Refill Requests</h1>
        <div class="sub">Review rider wallet top-ups</div>
      </div>
      <div class="topbar-links">
        <a href="riders.html" class="logout-link">🏍️ Riders</a>
        <a href="customers.html" class="logout-link">🙋 Customers</a>
        <a href="order-history.html" class="logout-link">📦 Order History</a>
        <a href="support.html" class="logout-link">🎧 Support</a>
        <a href="#" id="logoutLink" class="logout-link">🚪 Log Out</a>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="filter-tabs" id="filterTabs">
      <div class="filter-tab active" data-filter="pending">Pending <span class="count" id="count-pending">0</span></div>
      <div class="filter-tab" data-filter="approved">Approved <span class="count" id="count-approved">0</span></div>
      <div class="filter-tab" data-filter="rejected">Rejected <span class="count" id="count-rejected">0</span></div>
    </div>

    <div id="requestsList">
      <div class="empty-state">Loading…</div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script>
let currentAdmin = null;
let activeFilter = 'pending';
let unsubRequests = null;

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

requireAdminAuth((user, adminData)=>{
  currentAdmin = user;
  watchCounts();
  listenToRequests();
});

document.getElementById('filterTabs').querySelectorAll('.filter-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    if(tab.dataset.filter === activeFilter) return;
    activeFilter = tab.dataset.filter;
    document.getElementById('filterTabs').querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    listenToRequests();
  });
});

/* Keeps all three tab counts current regardless of which tab is open, so
   an admin can see at a glance how many are waiting without switching tabs. */
function watchCounts(){
  ['pending','approved','rejected'].forEach(status=>{
    db.collection('refillRequests').where('status','==', status).onSnapshot(snap=>{
      const el = document.getElementById(`count-${status}`);
      if(el) el.textContent = snap.size;
    });
  });
}

function listenToRequests(){
  if(unsubRequests) unsubRequests();
  const list = document.getElementById('requestsList');
  list.innerHTML = `<div class="empty-state">Loading…</div>`;

  unsubRequests = db.collection('refillRequests')
    .where('status','==', activeFilter)
    .orderBy(activeFilter === 'pending' ? 'createdAt' : 'reviewedAt', 'desc')
    .onSnapshot(snap=>{
      if(snap.empty){
        const glyphs = { pending: '📭', approved: '✅', rejected: '🚫' };
        const labels = {
          pending: 'No pending requests right now.',
          approved: 'No approved requests yet.',
          rejected: 'No rejected requests yet.'
        };
        list.innerHTML = `<div class="empty-state"><div class="glyph">${glyphs[activeFilter]}</div>${labels[activeFilter]}</div>`;
        return;
      }
      list.innerHTML = '';
      snap.forEach(doc=>{
        const r = doc.data();
        const row = document.createElement('div');
        row.className = 'request-card';
        row.innerHTML = `
          <div class="top-row">
            <div>
              <div class="rider">${r.riderName || 'Rider'}</div>
              <div class="when">${r.createdAt ? timeAgo(r.createdAt) : ''}</div>
            </div>
            <div class="amount">${fmtPeso(r.amount)}</div>
          </div>
          ${r.gcashRef ? `
            <div class="gcash-details">
              <div><span class="lbl">Ref #</span>${escapeHtml(r.gcashRef)}</div>
              <div><span class="lbl">Sender</span>${escapeHtml(r.gcashSenderName || '—')}</div>
            </div>
          ` : ''}
          ${activeFilter === 'pending' ? `
            <div class="request-actions">
              <button class="btn btn-reject btn-sm" style="flex:1;" data-action="reject">Reject</button>
              <button class="btn btn-approve btn-sm" style="flex:1;" data-action="approve">Approve</button>
            </div>
          ` : `<div class="when">Reviewed ${r.reviewedAt ? timeAgo(r.reviewedAt) : ''}</div>`}
        `;

        if(activeFilter === 'pending'){
          row.querySelector('[data-action="approve"]').addEventListener('click', async (e)=>{
            const btns = row.querySelectorAll('button');
            btns.forEach(b=>b.disabled = true);
            e.target.textContent = 'Approving…';
            try{
              await approveRefillRequest(doc.id, currentAdmin.uid);
            } catch(err){
              alert(err.message || "Couldn't approve this request.");
              btns.forEach(b=>b.disabled = false);
              e.target.textContent = 'Approve';
            }
          });
          row.querySelector('[data-action="reject"]').addEventListener('click', async (e)=>{
            const btns = row.querySelectorAll('button');
            btns.forEach(b=>b.disabled = true);
            e.target.textContent = 'Rejecting…';
            try{
              await rejectRefillRequest(doc.id, currentAdmin.uid);
            } catch(err){
              alert(err.message || "Couldn't reject this request.");
              btns.forEach(b=>b.disabled = false);
              e.target.textContent = 'Reject';
            }
          });
        }

        list.appendChild(row);
      });
    }, err=>{
      list.innerHTML = `<div class="empty-state">Couldn't load requests. Check the browser console for a Firestore index link if this is your first time here.</div>`;
    });
}

document.getElementById('logoutLink').addEventListener('click', async (e)=>{
  e.preventDefault();
  await auth.signOut();
  window.location.href = "index.html";
});
</script>
</body>
</html>
