<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support Chat · Padala Go Admin</title>
<link rel="stylesheet" href="../shared/styles.css">
<style>
  html, body{ height:100%; }
  body{ background:var(--paper); }
  .chat-shell{ display:flex; flex-direction:column; height:100vh; max-width:480px; margin:0 auto; }
  .chat-topbar{ background:var(--teal); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .chat-topbar .back{ color:#fff; text-decoration:none; font-size:20px; }
  .chat-topbar .who{ font-family:'Sora'; font-weight:700; font-size:16px; display:flex; align-items:center; gap:8px; }
  .chat-topbar .role-tag{
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
    background:rgba(255,255,255,0.2); padding:2px 7px; border-radius:8px;
  }
  .messages{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .bubble{ max-width:75%; padding:10px 14px; border-radius:16px; font-size:14px; line-height:1.4; word-wrap:break-word; }
  .bubble.mine{ align-self:flex-end; background:var(--teal); color:#fff; border-bottom-right-radius:4px; }
  .bubble.theirs{ align-self:flex-start; background:var(--cream); color:var(--ink); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .bubble .meta{ font-size:10.5px; opacity:0.65; margin-top:4px; }
  .composer{ display:flex; gap:8px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:#fff; flex-shrink:0; }
  .composer input{ flex:1; padding:11px 14px; border-radius:20px; border:1.5px solid var(--line); font-size:14px; font-family:'Inter'; }
  .composer input:focus{ outline:none; border-color:var(--teal); }
  .composer button{ width:42px; height:42px; border-radius:50%; background:var(--teal); color:#fff; border:none; font-size:18px; cursor:pointer; flex-shrink:0; }
  .composer button:disabled{ opacity:0.5; }
</style>
</head>
<body>
<div class="chat-shell">
  <div class="chat-topbar">
    <a href="support.html" class="back" id="backLink">←</a>
    <div class="who" id="chatTitle">
      Loading… <span class="role-tag" id="roleTag" style="display:none;"></span>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="empty-state">Loading…</div>
  </div>

  <form class="composer" id="composerForm">
    <input type="text" id="messageInput" placeholder="Reply…" autocomplete="off" required>
    <button type="submit" id="sendBtn">➤</button>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const threadUserId = params.get('id');
let currentAdmin = null;

requireAdminAuth((user)=>{
  currentAdmin = user;
  if(!threadUserId){ window.location.href = "support.html"; return; }
  loadThreadHeader();
  listenToMessages();
  // Opening the thread is what clears the admin's unread flag for it.
  db.collection('supportChats').doc(threadUserId).update({ unreadForAdmin: false }).catch(()=>{});
});

async function loadThreadHeader(){
  const doc = await db.collection('supportChats').doc(threadUserId).get();
  if(!doc.exists){
    document.getElementById('chatTitle').textContent = 'Thread not found';
    return;
  }
  const t = doc.data();
  document.getElementById('chatTitle').innerHTML = `
    ${escapeHtml(t.userName || 'User')}
    <span class="role-tag" id="roleTag">${t.userRole || ''}</span>
  `;
}

function listenToMessages(){
  db.collection('supportChats').doc(threadUserId).collection('messages')
    .orderBy('createdAt','asc')
    .onSnapshot(snap=>{
      const container = document.getElementById('messages');
      if(snap.empty){
        container.innerHTML = `<div class="empty-state"><div class="glyph">🎧</div>No messages yet.</div>`;
        return;
      }
      container.innerHTML = '';
      snap.forEach(doc=>{
        const m = doc.data();
        const mine = m.senderRole === 'admin';
        const bubble = document.createElement('div');
        bubble.className = `bubble ${mine ? 'mine' : 'theirs'}`;
        bubble.innerHTML = `
          ${escapeHtml(m.text)}
          <div class="meta">${m.createdAt ? timeAgo(m.createdAt) : 'sending…'}</div>
        `;
        container.appendChild(bubble);
      });
      container.scrollTop = container.scrollHeight;
    }, err=>{
      document.getElementById('messages').innerHTML = `<div class="empty-state">Couldn't load messages.</div>`;
    });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('composerForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if(!text || !currentAdmin) return;
  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;
  input.value = '';
  try{
    const threadRef = db.collection('supportChats').doc(threadUserId);
    await threadRef.collection('messages').add({
      senderId: currentAdmin.uid,
      senderRole: 'admin',
      senderName: 'Padala Go Team',
      text,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await threadRef.update({
      lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
      lastMessageText: text,
      lastMessageSenderRole: 'admin',
      unreadForUser: true
    });
  } catch(err){
    input.value = text;
  }
  sendBtn.disabled = false;
  input.focus();
});
</script>
</body>
</html>
